name: lint

# The default branch is `master`. This previously said `main`, so the job
# had never run — not once, on any PR. `ruff check .` reported 104 findings
# at the time it was fixed; see ruff.toml for which are configured off and
# why, and the accompanying commit for the two real bugs it was hiding.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        # Pinned: an unpinned linter turns "someone released a new rule"
        # into "every PR is red", on a repo where a red gate has already
        # proven to mean an ignored gate.
        run: pip install 'ruff==0.15.*'
      - name: Lint
        run: ruff check . --output-format=github

  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile-check all Python files
        run: |
          python -m compileall -q server.py pipeline/ tools/ app/

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          pip install -r requirements-dev.txt
          # Separate, and from the CPU index: the default index serves the
          # multi-GB CUDA build, which this suite has no use for. ~17s.
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
      - name: Run tests
        # -p no:randomly keeps ordering stable; the suite has one known
        # whole-suite ordering artifact (an unawaited coroutine warning in
        # test_lm_studio_client) that predates this job.
        run: pytest -q
