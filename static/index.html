<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GoChiDUBB Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0d;
    --bg-1: #101014;
    --bg-2: #16161c;
    --bg-3: #1d1d25;
    --line: #24242e;
    --line-2: #2f2f3c;
    --ink: #ece9e0;
    --ink-2: #a3a096;
    --ink-3: #5a5a63;
    --ink-4: #35353d;
    --accent: oklch(0.88 0.18 125);
    --accent-dim: oklch(0.88 0.18 125 / 0.15);
    --accent-glow: oklch(0.88 0.18 125 / 0.4);
    --warn: oklch(0.78 0.15 60);
    --err: oklch(0.7 0.2 25);
    --serif: 'Instrument Serif', ui-serif, Georgia, serif;
    --sans: 'Geist', ui-sans-serif, system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 400;
    letter-spacing: -0.005em;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow: hidden;
    /* Nothing should ever be reachable only by scrolling sideways. */
    overflow-x: hidden;
  }
  /* 100vw includes the scrollbar gutter and causes a permanent horizontal
     overflow on desktop; 100dvh tracks the mobile URL bar collapsing, where
     100vh leaves the bottom of the app under it. */
  #root { width: 100%; height: 100vh; height: 100dvh; }

  /* View padding is set inline all over the app; routing it through a custom
     property is what lets one media query retune every screen at once. */
  :root { --pad: 40px; --gutter: 22px; --rail-w: 232px; }

  /* Long URLs (a YouTube source is the common case) must wrap instead of
     forcing the whole column wider than the viewport. */
  .wrap-any { overflow-wrap: anywhere; word-break: break-word; min-width: 0; }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--ink-4); }

  button { font-family: inherit; font-size: inherit; color: inherit; background: none; border: none; cursor: pointer; letter-spacing: inherit; }
  input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; background: transparent; border: none; outline: none; }

  .serif { font-family: var(--serif); font-weight: 400; letter-spacing: -0.01em; }
  .mono { font-family: var(--mono); font-size: 11px; letter-spacing: -0.01em; }
  .caps { font-size: 10px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.04;
    z-index: 9999;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.8'/%3E%3C/svg%3E");
  }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 7px 12px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--bg-1);
    color: var(--ink-2);
    font-size: 12px;
    font-weight: 500;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--line-2); color: var(--ink); background: var(--bg-2); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn:disabled:hover { border-color: var(--line); color: var(--ink-2); background: var(--bg-1); }
  .btn-primary {
    background: var(--accent);
    color: #0a0a0d;
    border-color: var(--accent);
    font-weight: 600;
  }
  .btn-primary:hover { filter: brightness(1.1); border-color: var(--accent); color: #0a0a0d; background: var(--accent); }
  .btn-primary:disabled { background: var(--bg-2); color: var(--ink-3); border-color: var(--line); }
  .btn-primary:disabled:hover { filter: none; }
  .btn-ghost { border-color: transparent; background: transparent; }
  .btn-ghost:hover { border-color: var(--line); background: var(--bg-1); }

  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 8px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--bg-1);
    color: var(--ink-2);
    font-size: 11px;
    font-weight: 500;
    /* Without this a pill in a narrow column wraps its label one word per
       line and the border-radius turns it into a circle. */
    white-space: nowrap;
    max-width: 100%;
  }
  .chip.accent { color: var(--accent); border-color: var(--accent-dim); background: var(--accent-dim); }

  .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
  .panel { background: var(--bg-1); border: 1px solid var(--line); border-radius: 10px; }

  .field {
    padding: 8px 10px;
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--ink);
    transition: border-color 0.12s;
    width: 100%;
    font-size: 12.5px;
  }
  .field:hover { border-color: var(--line-2); }
  .field:focus { border-color: var(--accent); }

  .tab {
    padding: 8px 2px;
    color: var(--ink-3);
    font-size: 12px;
    font-weight: 500;
    border-bottom: 1px solid transparent;
    cursor: pointer;
    transition: color 0.12s, border-color 0.12s;
  }
  .tab:hover { color: var(--ink-2); }
  .tab.active { color: var(--ink); border-bottom-color: var(--accent); }

  .scroll { overflow-y: auto; overflow-x: hidden; }
  .scroll::-webkit-scrollbar { width: 4px; }

  .dropzone {
    border: 1px dashed var(--line-2);
    border-radius: 10px;
    padding: 28px 20px;
    text-align: center;
    background: var(--bg-1);
    cursor: pointer;
    transition: all 0.15s;
  }
  .dropzone:hover { border-color: var(--accent-dim); background: var(--bg-2); }
  .dropzone.dragging { border-color: var(--accent); background: var(--accent-dim); }

  /* ── Phones / narrow windows ──────────────────────────────────────
     The desktop shell is a fixed 232px rail beside a flex column. At 390px
     that leaves ~158px of content, which is why every label wrapped one word
     per line. Below this breakpoint the rail becomes an off-canvas drawer
     (see LeftRail/useIsNarrow in the app) and the content takes the full
     width. Keep this in sync with NARROW_QUERY in the script below. */
  @media (max-width: 860px) {
    :root { --pad: 16px; --gutter: 14px; }

    /* Tables, timelines and code blocks scroll inside their own box rather
       than widening the page. */
    .scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; }

    /* Touch targets: 12px labels are legible but 24px buttons are not
       tappable. Only pad the interactive ones. */
    .btn { padding: 9px 14px; }
    .tab { padding: 10px 4px; }
  }

  /* Backdrop behind the mobile nav drawer. */
  .scrim {
    position: fixed; inset: 0; z-index: 55;
    background: rgba(0, 0, 0, 0.55);
    animation: fadeIn 0.15s;
  }
</style>
</head>

const fmtSec = (s) => {
  if (!s && s !== 0) return '—';
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = Math.floor(s % 60);
  if (h > 0) return `${h}:${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
  return `${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
};

const fmtAge = (ts) => {
  if (!ts) return '';
  const now = Date.now() / 1000;
  const d = now - ts;
  if (d < 60) return 'just now';
  if (d < 3600) return Math.floor(d / 60) + 'm ago';
  if (d < 86400) return Math.floor(d / 3600) + 'h ago';
  if (d < 7 * 86400) return Math.floor(d / 86400) + 'd ago';
  const dt = new Date(ts * 1000);
  return dt.toLocaleDateString();
};

// Keep in sync with the @media block in the stylesheet above — the CSS
// retunes spacing, this drives the structural change (rail becomes a drawer).
const NARROW_QUERY = '(max-width: 860px)';

function useMediaQuery(query) {
  const [matches, setMatches] = useState(() => {
    try { return window.matchMedia(query).matches; } catch (_) { return false; }
  });
  useEffect(() => {
    let mq;
    try { mq = window.matchMedia(query); } catch (_) { return; }
    const on = (e) => setMatches(e.matches);
    setMatches(mq.matches);
    // addListener is the pre-Safari-14 spelling; phones are exactly where the
    // old API still shows up.
    if (mq.addEventListener) mq.addEventListener('change', on);
    else if (mq.addListener) mq.addListener(on);
    return () => {
      if (mq.removeEventListener) mq.removeEventListener('change', on);
      else if (mq.removeListener) mq.removeListener(on);
    };
  }, [query]);
  return matches;
}

const useIsNarrow = () => useMediaQuery(NARROW_QUERY);

// Wall-clock only — the log viewer shows one session, so the date is noise.
const fmtClock = (ts) => {
  if (!ts) return '--:--:--';
  const d = new Date(ts * 1000);
  return [d.getHours(), d.getMinutes(), d.getSeconds()]
    .map(n => String(n).padStart(2, '0')).join(':');
};

const _lsGet = (key, fallback) => {
  try {
    const v = localStorage.getItem('gochidubb_pref_' + key);
    if (v === null) return fallback;
    if (v === 'true') return true;
    if (v === 'false') return false;
    return v;
  } catch (_) { return fallback; }
};
const _lsSet = (key, v) => {
  try { localStorage.setItem('gochidubb_pref_' + key, String(v)); } catch (_) {}
};

// ═══════════════════════════════════════════════════════════════════
// SPHERE COMPONENT (simplified)
// ═══════════════════════════════════════════════════════════════════
function mountSphere(el, opts) {
  const { variant = 'idle', size = 220 } = opts || {};
  if (!el || typeof THREE === 'undefined') {
    el.innerHTML = `<div style="width:${size}px;height:${size}px;border-radius:50%;
      border:1px solid var(--line-2);background:radial-gradient(circle at 30% 30%,
      var(--bg-2),var(--bg) 70%);"></div>`;
    return () => { el.innerHTML = ''; };
  }
  const palette = variant === 'live'
    ? { core: 0xccff66, rim: 0x88dd44, breath: 1.6 }
    : { core: 0x9ab4d4, rim: 0x5a7094, breath: 3.2 };

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
  camera.position.set(0, 0, 5.2);
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 0);
  renderer.setSize(size, size);
  el.appendChild(renderer.domElement);

  const geo = new THREE.IcosahedronGeometry(1.4, 3);
  const mat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uCore: { value: new THREE.Color(palette.core) }, uRim: { value: new THREE.Color(palette.rim) } },
    vertexShader: `
      varying vec3 vNormal; varying vec3 vPos;
      uniform float uTime;
      float noise(vec3 p) {
        return sin(p.x*2.0+uTime*0.7)*0.5 + cos(p.y*1.7+uTime*0.5)*0.5 + sin(p.z*2.3+uTime*0.6)*0.3;
      }
      void main() {
        vNormal = normal; vPos = position;
        float n = noise(position*0.8) * 0.12;
        vec3 d = position + normal * n;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(d, 1.0);
      }`,
    fragmentShader: `
      varying vec3 vNormal; varying vec3 vPos;
      uniform vec3 uCore; uniform vec3 uRim; uniform float uTime;
      void main() {
        vec3 view = normalize(cameraPosition - vPos);
        float rim = pow(1.0 - max(dot(vNormal, view), 0.0), 2.2);
        float pulse = 0.5 + 0.5 * sin(uTime * 0.5);
        vec3 col = mix(uCore * 0.25, uRim, rim);
        col *= 0.8 + pulse * 0.3;
        gl_FragColor = vec4(col, 0.95);
      }`,
    transparent: true, depthWrite: false,
  });
  const mesh = new THREE.Mesh(geo, mat);
  scene.add(mesh);
  const halo = new THREE.Mesh(
    new THREE.IcosahedronGeometry(1.7, 2),
    new THREE.MeshBasicMaterial({ color: palette.rim, wireframe: true, transparent: true, opacity: variant === 'live' ? 0.35 : 0.18 })
  );
  scene.add(halo);

  let t0 = performance.now(); let raf;
  const tick = () => {
    const t = (performance.now() - t0) * 0.001;
    mat.uniforms.uTime.value = t * palette.breath;
    mesh.rotation.y = t * 0.12; mesh.rotation.x = Math.sin(t * 0.2) * 0.08;
    halo.rotation.y = -t * 0.06;
    renderer.render(scene, camera);
    raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
  return () => {
    cancelAnimationFrame(raf);
    renderer.dispose(); geo.dispose(); mat.dispose();
    halo.geometry.dispose(); halo.material.dispose();
    if (renderer.domElement.parentNode === el) el.removeChild(renderer.domElement);
  };
}

function Toggle({ value, onChange, label, hint, disabled = false }) {

function Select({ value, onChange, children }) {

function SectionHeader({ index, title, subtitle }) {

function StatusBadge({ status }) {

// ═══════════════════════════════════════════════════════════════════
// SETUP NOTICES
// ═══════════════════════════════════════════════════════════════════
// This app runs on the user's own machine with no logs they'll ever read,
// so anything that says "your environment is wrong" has to arrive here.
// Notices come from /api/system (which merges passive checks, whatever the
// last pipeline run observed, and the last deep probe). `code` is the
// identity — dismissal and dedupe both key on it, never on the title.

const SEV_META = {
  error: { color: 'var(--err)',  bg: 'oklch(0.7 0.2 25 / 0.08)',   line: 'oklch(0.7 0.2 25 / 0.3)',   label: 'Problem' },
  warn:  { color: 'var(--warn)', bg: 'oklch(0.78 0.15 60 / 0.08)', line: 'oklch(0.78 0.15 60 / 0.3)', label: 'Degraded' },
  info:  { color: 'var(--ink-2)',bg: 'var(--bg-1)',                line: 'var(--line)',               label: 'Note' },
};
const sevMeta = (s) => SEV_META[s] || SEV_META.warn;

// Dismissals persist so a known-and-accepted warning (e.g. "running on CPU")
// doesn't nag on every launch. Stored as a comma-joined list of codes because
// _lsSet stringifies whatever it's handed.
const _dismissedCodes = () => {
  const raw = _lsGet('setup_dismissed', '');
  return String(raw || '').split(',').filter(Boolean);
};
const _dismiss = (code) => {
  const set = new Set(_dismissedCodes());
  set.add(code);
  _lsSet('setup_dismissed', Array.from(set).join(','));
};
const _undismissAll = () => _lsSet('setup_dismissed', '');

function SetupBanner({ notices, onOpenSetup }) {
  const [dismissed, setDismissed] = useState(_dismissedCodes);
  const live = (notices || []).filter(n => !dismissed.includes(n.code));
  if (!live.length) return null;

  const top = live[0];
  const meta = sevMeta(top.severity);
  const rest = live.length - 1;

  return (
    <div style={{
      margin: '12px 22px 0', padding: '11px 13px', borderRadius: 8,
      background: meta.bg, border: '1px solid ' + meta.line,
      display: 'flex', alignItems: 'flex-start', gap: 10,
      animation: 'slideUp 0.25s',
    }}>
      <span style={{ color: meta.color, marginTop: 1, flexShrink: 0 }}>{I.warn}</span>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontSize: 12, color: 'var(--ink)' }}>{top.title}</div>
        {top.remediation?.length > 0 && (
          <div className="mono" style={{ fontSize: 10, color: 'var(--ink-2)', marginTop: 3 }}>
            {top.remediation[0]}
          </div>
        )}
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 7, flexWrap: 'wrap' }}>
          {top.url && (
            <a href={top.url} target="_blank" rel="noreferrer" className="chip"
               style={{ color: meta.color, borderColor: meta.line, textDecoration: 'none' }}>
              Open link ↗
            </a>
          )}
          <button className="chip" onClick={onOpenSetup}
                  style={{ color: 'var(--ink-2)', cursor: 'pointer' }}>
            {rest > 0 ? `Details · ${rest} more` : 'Details'}
          </button>
          <span className="mono" style={{ fontSize: 9, color: 'var(--ink-4)' }}>{top.code}</span>
        </div>
      </div>
      <button className="btn btn-ghost" title="Dismiss until it happens again"
              onClick={() => { _dismiss(top.code); setDismissed(_dismissedCodes()); }}
              style={{ padding: '2px 6px', flexShrink: 0 }}>
        {I.cancel}
      </button>
    </div>
  );
}

// Full notice with every remediation step — the Setup tab's unit of display.
function NoticeCard({ n }) {
  const meta = sevMeta(n.severity);
  return (
    <div style={{
      padding: '12px 14px', borderRadius: 8, marginBottom: 10,
      background: meta.bg, border: '1px solid ' + meta.line,
    }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
        <span style={{ color: meta.color }}>{I.warn}</span>
        <span style={{ fontSize: 12.5, color: 'var(--ink)' }}>{n.title}</span>
        <div style={{ flex: 1 }}/>
        <span className="mono" style={{ fontSize: 9, color: meta.color }}>{meta.label}</span>
      </div>
      {n.detail && (
        <pre className="mono" style={{
          fontSize: 10, color: 'var(--ink-2)', marginTop: 8, whiteSpace: 'pre-wrap',
          wordBreak: 'break-word', lineHeight: 1.5,
        }}>{n.detail}</pre>
      )}
      {n.remediation?.length > 0 && (
        <ol style={{ margin: '9px 0 0', paddingLeft: 18, fontSize: 11, color: 'var(--ink-2)', lineHeight: 1.7 }}>
          {n.remediation.map((r, i) => <li key={i}>{r}</li>)}
        </ol>
      )}
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 9 }}>
        {n.url && (
          <a href={n.url} target="_blank" rel="noreferrer" className="chip"
             style={{ color: meta.color, borderColor: meta.line, textDecoration: 'none' }}>
            {n.url.replace(/^https?:\/\//, '').slice(0, 46)} ↗
          </a>
        )}
        <div style={{ flex: 1 }}/>
        <span className="mono" style={{ fontSize: 9, color: 'var(--ink-4)' }}>
          {n.subsystem ? n.subsystem + ' · ' : ''}{n.code}
        </span>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
// LEFT RAIL (simplified)
// ═══════════════════════════════════════════════════════════════════
function LeftRail({ view, setView, runningJob, awaitingReviewCount, system,
                    narrow = false, open = false, onClose }) {
  const sections = [
    { id: 'home',        label: 'Home',         hint: 'Upload · queue',       ic: I.home },
    { id: 'processing',  label: 'Processing',   hint: runningJob ? 'Live job' : 'Idle', ic: I.processing, badge: runningJob ? '●' : null },
    { id: 'review',      label: 'Review',       hint: awaitingReviewCount > 0 ? 'Wizard pause' : 'Nothing pending', ic: I.review, badge: awaitingReviewCount > 0 ? String(awaitingReviewCount) : null },
    { id: 'result',      label: 'Result',       hint: 'Last completed',       ic: I.result },
    { id: 'history',     label: 'History',      hint: 'All jobs',             ic: I.history },
    { id: 'batch',       label: 'Batch',        hint: 'Queue & scheduled',    ic: I.batch },
    { id: 'voices',      label: 'Voices',       hint: 'Library · clone refs', ic: I.voice || I.review },
    { id: 'glossary',    label: 'Glossary',     hint: 'Translation overrides',ic: I.glossary || I.edit },
  ];

  const vramTotal = system?.gpu?.vram_gb;
  const vramFree = system?.gpu?.vram_free_gb;
  const vramUsed = (vramTotal != null && vramFree != null) ? Math.max(0, vramTotal - vramFree) : null;
  // system.gpu is CUDA-only, so on Apple Silicon it reports a broken GPU on a
  // machine where MPS works. system.accelerator is the MPS-aware probe.
  const acc = system?.accelerator;
  const gpuName = acc?.name || system?.gpu?.name || 'GPU';
  const accelOk = acc ? acc.ok !== false : (system?.gpu?.ok ?? null);
  // The rail's warning state now tracks real problems instead of "no CUDA",
  // which never cleared and taught everyone to ignore it.
  const problems = (system?.notices || []).filter(n => n.severity === 'error');
  const warnings = (system?.notices || []).filter(n => n.severity === 'warn');
  const issueCount = problems.length + warnings.length;
  const sysHint = problems.length ? `${problems.length} problem${problems.length > 1 ? 's' : ''}`
                : warnings.length ? `${warnings.length} warning${warnings.length > 1 ? 's' : ''}`
                : 'GPU · models · storage';

  // On a phone the rail cannot hold a column of its own — 232px of a 390px
  // viewport left the content ~158px wide, which is what wrapped every label
  // one word per line. Off-canvas instead: same markup, taken out of flow.
  const go = (id) => { setView(id); if (narrow && onClose) onClose(); };

  return (
    <aside style={{
      width: narrow ? 'min(280px, 84vw)' : 'var(--rail-w)',
      background: 'var(--bg)',
      borderRight: '1px solid var(--line)',
      display: 'flex', flexDirection: 'column', flexShrink: 0,
      ...(narrow ? {
        position: 'fixed', top: 0, left: 0, bottom: 0, zIndex: 60,
        transform: open ? 'translateX(0)' : 'translateX(-100%)',
        transition: 'transform 0.22s ease',
        boxShadow: open ? '0 0 40px rgba(0,0,0,0.6)' : 'none',
      } : {}),
    }}>
      <div style={{ padding: '20px 20px 18px' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <div style={{
            width: 24, height: 24, borderRadius: 6, background: 'var(--accent)',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            boxShadow: '0 0 18px var(--accent-glow)',
          }}>
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#0a0a0d" strokeWidth="1.6"><path d="M2 6c0-1.5.8-2.5 2-2.5s2 1 2 2.5-.8 2.5-2 2.5"/><path d="M6 6c0-1.5.8-2.5 2-2.5s2 1 2 2.5"/></svg>
          </div>
          <div>
            <div className="serif" style={{ fontSize: 19, lineHeight: 1, letterSpacing: '-0.02em' }}>GoChiDUBB</div>
            <div className="mono" style={{ color: 'var(--ink-4)', fontSize: 9, marginTop: 3 }}>studio</div>
          </div>
        </div>
      </div>

      <div style={{ padding: '0 12px', flex: 1, overflow: 'auto' }}>
        <div className="caps" style={{ margin: '0 8px 8px' }}>Workspace</div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 1 }}>
          {sections.map(s => <NavItem key={s.id} item={s} active={view === s.id} onClick={() => go(s.id)}/>)}
        </div>

        <div className="caps" style={{ margin: '20px 8px 8px' }}>System</div>
        <NavItem
          item={{ id: 'system', label: 'System', hint: sysHint, ic: I.system,
                  badge: issueCount > 0 ? String(issueCount) : null }}
          active={view === 'system'}
          onClick={() => go('system')}
          warn={problems.length > 0}
        />
      </div>

      <div style={{ padding: 12, borderTop: '1px solid var(--line)' }}>
        <div style={{ padding: 10, background: 'var(--bg-1)', border: '1px solid var(--line)', borderRadius: 6 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 4 }}>
            <span style={{ color: 'var(--ink-3)' }}>{I.cpu}</span>
            <span className="mono" style={{ fontSize: 10, color: 'var(--ink-2)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
              {gpuName.replace(/^NVIDIA /, '').slice(0, 18)}
            </span>
            <div style={{ flex: 1 }}/>
            <span className="dot" style={{ background: accelOk === false ? 'var(--err)' : 'var(--accent)', boxShadow: accelOk === false ? 'none' : '0 0 6px var(--accent-glow)' }}/>
          </div>
          {vramTotal ? (
            <>
              <div style={{ display: 'flex', alignItems: 'baseline', gap: 4 }}>
                <span className="serif" style={{ fontSize: 16 }}>{vramUsed?.toFixed(1) ?? '—'}</span>
                <span className="mono" style={{ fontSize: 10, color: 'var(--ink-3)' }}>/ {vramTotal} GB · VRAM</span>
              </div>
              <div style={{ height: 2, background: 'var(--bg-3)', borderRadius: 1, marginTop: 6, overflow: 'hidden' }}>
                <div style={{ height: '100%', width: `${Math.min(100, (vramUsed / vramTotal) * 100)}%`, background: 'var(--accent)', opacity: 0.7 }}/>
              </div>
            </>
          ) : acc ? (
            // No VRAM figure doesn't mean no accelerator — MPS exposes no
            // total-memory API, and this card used to sit on "Loading…" forever.
            <div className="mono" style={{ fontSize: 10, color: 'var(--ink-3)' }}>
              {acc.backend ? acc.backend + ' · ' : ''}{acc.ok ? 'ready' : 'CPU only'}
            </div>
          ) : (
            <div className="mono" style={{ fontSize: 10, color: 'var(--ink-4)' }}>Loading…</div>
          )}
        </div>
        <div style={{ padding: '8px 12px 4px', borderTop: '1px solid var(--line)', textAlign: 'center' }}>
          <div className="mono" style={{ fontSize: 9, color: 'var(--ink-4)', lineHeight: 1.6 }}>
            TachikomaRed &amp; smolemaru
          </div>
        </div>
      </div>
    </aside>
  );
}

function NavItem({ item, active, onClick, warn }) {
  return (
    <button onClick={onClick} style={{
      display: 'flex', alignItems: 'center', gap: 10,
      padding: '9px 10px', borderRadius: 6,
      background: active ? 'var(--bg-2)' : 'transparent',
      border: '1px solid ' + (active ? 'var(--line-2)' : 'transparent'),
      color: active ? 'var(--ink)' : 'var(--ink-2)',
      textAlign: 'left', transition: 'all 0.12s',
    }}>
      <div style={{
        width: 22, height: 22, borderRadius: 5,
        background: active ? 'var(--bg-3)' : 'var(--bg-1)',
        border: '1px solid ' + (active ? 'var(--line-2)' : 'var(--line)'),
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        color: warn ? 'var(--err)' : (active ? 'var(--accent)' : 'var(--ink-3)'),
        flexShrink: 0,
      }}>{item.ic}</div>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontSize: 12, fontWeight: active ? 500 : 400 }}>{item.label}</div>
        <div className="mono" style={{ color: warn ? 'var(--err)' : 'var(--ink-4)', fontSize: 10, marginTop: 1 }}>{item.hint}</div>
      </div>
      {item.badge && (
        <span style={{
          fontSize: 9, color: item.badge === '●' ? 'var(--accent)' : 'var(--ink-3)',
          fontFamily: 'var(--mono)', padding: '2px 5px', borderRadius: 4,
          background: item.badge === '●' ? 'transparent' : 'var(--bg-2)',
          border: item.badge === '●' ? 'none' : '1px solid var(--line)',
          animation: item.badge === '●' ? 'pulse 1.5s infinite' : 'none',
        }}>{item.badge}</span>
      )}
    </button>
  );
}

// ═══════════════════════════════════════════════════════════════════
// TOP BAR
// ═══════════════════════════════════════════════════════════════════
function TopBar({ view, runningJob, awaitingReviewCount, notices, onJumpToProcessing,
                  onJumpToReview, onOpenSetup, narrow = false, onOpenNav }) {
  const TITLES = {
    home: 'Home', processing: 'Processing', review: 'Review · wizard pause',
    result: 'Result', history: 'History', batch: 'Batch queue', system: 'System',
    voices: 'Voices', glossary: 'Glossary',
  };
  const issues = notices || [];
  const worst = issues.some(n => n.severity === 'error') ? 'error'
              : issues.some(n => n.severity === 'warn') ? 'warn' : '';
  const overall = (runningJob?.progress ?? 0) / 100;
  const eta = runningJob?.eta_seconds ?? null;

  return (
    <div style={{
      height: 50, borderBottom: '1px solid var(--line)',
      display: 'flex', alignItems: 'center',
      padding: '0 var(--gutter)', gap: 10, background: 'var(--bg)', flexShrink: 0,
      overflow: 'hidden',
    }}>
      {narrow && (
        <button onClick={onOpenNav} aria-label="Open navigation"
                style={{ display: 'flex', flexDirection: 'column', gap: 3,
                         padding: '10px 6px 10px 0', flexShrink: 0 }}>
          {[0, 1, 2].map(i => (
            <span key={i} style={{ display: 'block', width: 17, height: 1.5,
                                   background: 'var(--ink-2)', borderRadius: 1 }}/>
          ))}
        </button>
      )}
      <div className="serif" style={{ fontSize: narrow ? 15 : 17, letterSpacing: '-0.01em',
                                      flexShrink: 0 }}>
        {TITLES[view] || 'GoChiDUBB Studio'}
      </div>
      {view === 'processing' && runningJob && !narrow && (
        // A YouTube URL is ~45 chars of unbreakable text; on a phone it pushed
        // the whole bar wider than the screen, so it only shows with room.
        <span className="mono" style={{
          fontSize: 10, color: 'var(--ink-4)', marginTop: 2, minWidth: 0,
          overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
        }}>
          · {(runningJob.title || runningJob.source_label || runningJob.source || runningJob.id).slice(0, 50)}
        </span>
      )}
      <div style={{ flex: 1, minWidth: 8 }}/>

      {runningJob && view !== 'processing' && (
        <button onClick={onJumpToProcessing} className="chip" style={{ color: 'var(--ink-2)', cursor: 'pointer' }}>
          <span className="dot" style={{ background: 'var(--accent)', boxShadow: '0 0 5px var(--accent-glow)', animation: 'pulse 1.5s infinite' }}/>
          <span>Running · {(overall * 100).toFixed(0)}%</span>
          {eta != null && <span className="mono" style={{ color: 'var(--ink-4)' }}>· ETA {Math.round(eta / 60)}m</span>}
        </button>
      )}

      {awaitingReviewCount > 0 && view !== 'review' && (
        <button onClick={onJumpToReview} className="chip" style={{
          color: 'var(--warn)', borderColor: 'var(--warn)',
          background: 'oklch(0.78 0.15 60 / 0.1)', cursor: 'pointer',
        }}>
          {I.review} {awaitingReviewCount} awaiting review
        </button>
      )}

      {worst && view !== 'system' && (
        <button onClick={onOpenSetup} className="chip" style={{
          color: sevMeta(worst).color, borderColor: sevMeta(worst).line,
          background: sevMeta(worst).bg, cursor: 'pointer',
        }}>
          {I.warn} {issues.length} setup {issues.length === 1 ? 'issue' : 'issues'}
        </button>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
// HOME VIEW — with dynamic model loading
// ═══════════════════════════════════════════════════════════════════
function HomeView({ system, voicePresets, sphereOn, onJobSubmitted }) {
  // ── Dynamic models state ──
  const [availableModels, setAvailableModels] = useState([]);
  const [translationBackend, setTranslationBackend] = useState('lm_studio');
  const [loadingModels, setLoadingModels] = useState(true);

  // ── Form state ──
  const [mode, setMode] = useState('url');
  const [batchMode, setBatchMode] = useState(false);
  const [quickTestMode, setQuickTestMode] = useState(false);
  const [showcaseMode, setShowcaseMode] = useState(false);
  const switchTo = (target) => {
    setBatchMode(target === 'batch');
    setQuickTestMode(target === 'quick');
    setShowcaseMode(target === 'showcase');
  };
  const [videoFile, setVideoFile] = useState(null);
  const [ytUrl, setYtUrl] = useState('');
  const [refFile, setRefFile] = useState(null);
  const [batchFiles, setBatchFiles] = useState([]);
  const [batchUrls, setBatchUrls] = useState('');
  const [batchLabel, setBatchLabel] = useState('');
  const [batchSchedule, setBatchSchedule] = useState('');

  const [srcLang, setSrcLang] = useState(() => _lsGet('srcLang', 'auto'));
  const [tgtLang, setTgtLang] = useState(() => _lsGet('tgtLang', 'ru'));
  const [model, setModel] = useState(() => _lsGet('model', ''));
  const [whisperModel, setWhisperModel] = useState(() => _lsGet('whisperModel', 'base'));
  const [speakerMode, setSpeakerMode] = useState(() => _lsGet('speakerMode', 'main'));
  const [voicePreset, setVoicePreset] = useState(() => _lsGet('voicePreset', 'auto'));
  const [voiceStyle, setVoiceStyle] = useState('');
  const [ttsSpeed, setTtsSpeed] = useState(() => _lsGet('ttsSpeed', 'balanced'));
  const [contextHint, setContextHint] = useState(() => _lsGet('contextHint', ''));
  const [keepBg, setKeepBg] = useState(() => _lsGet('keepBg', false));
  const [autoDenoise, setAutoDenoise] = useState(() => _lsGet('autoDenoise', false));
  const [lipSync, setLipSync] = useState(() => _lsGet('lipSync', false));
  const [llmRegroup, setLlmRegroup] = useState(() => _lsGet('llmRegroup', false));
  const [wizardReview, setWizardReview] = useState(() => _lsGet('wizardReview', false));

  const [qtTrimSeconds, setQtTrimSeconds] = useState(() => _lsGet('qtTrim', 60));
  const [qtLangs, setQtLangs] = useState(() => {
    const stored = _lsGet('qtLangs', null);
    return Array.isArray(stored) && stored.length >= 2 ? stored : ['es', 'fr', 'de', 'ja', 'pt'];
  });

  const [submitting, setSubmitting] = useState(false);
  const [error, setError] = useState(null);
  const [lipStatus, setLipStatus] = useState(null);

  // ── Fetch models dynamically ──
  useEffect(() => {
    const fetchModels = async () => {
      setLoadingModels(true);
      try {
        // First check which backend is active from system
        if (system) {
          const backend = system.translation_backend || 
                         (system.lm_studio?.ok ? 'lm_studio' : 
                          system.ollama?.ok ? 'ollama' : 'unknown');
          setTranslationBackend(backend);
        }

        // Try to fetch models from LM Studio
        const res = await fetch('/api/lm_studio/models');
        if (res.ok) {
          const data = await res.json();
          if (data.models && data.models.length > 0) {
            setAvailableModels(data.models);
            // If no model selected or current model not in list, select first
            if (!model || !data.models.includes(model)) {
              // Prefer Qwen models
              const qwenModel = data.models.find(m => m.toLowerCase().includes('qwen'));
              setModel(qwenModel || data.models[0]);
            }
            setLoadingModels(false);
            return;
          }
        }

        // Fallback: try system endpoint
        if (system) {
          const sysModels = system.lm_studio?.models || system.ollama?.models || [];
          if (sysModels.length > 0) {
            setAvailableModels(sysModels);
            if (!model || !sysModels.includes(model)) {
              const qwenModel = sysModels.find(m => String(m).toLowerCase().includes('qwen'));
              setModel(qwenModel || sysModels[0]);
            }
            setLoadingModels(false);
            return;
          }
        }

        // Final fallback: use known good models
        const fallback = ['Qwen/Qwen2.5-14B-Instruct', 'Qwen/Qwen2.5-7B-Instruct', 'google/gemma-3-12b-it'];
        setAvailableModels(fallback);
        if (!model) setModel(fallback[0]);
        setLoadingModels(false);
      } catch (e) {
        console.warn('Failed to fetch models:', e);
        const fallback = ['Qwen/Qwen2.5-14B-Instruct', 'Qwen/Qwen2.5-7B-Instruct'];
        setAvailableModels(fallback);
        if (!model) setModel(fallback[0]);
        setLoadingModels(false);
      }
    };
    fetchModels();
  }, [system]);

  // ── Persist preferences ──
  useEffect(() => { _lsSet('srcLang', srcLang); }, [srcLang]);
  useEffect(() => { _lsSet('tgtLang', tgtLang); }, [tgtLang]);
  useEffect(() => { _lsSet('model', model); }, [model]);
  useEffect(() => { _lsSet('whisperModel', whisperModel); }, [whisperModel]);
  useEffect(() => { _lsSet('speakerMode', speakerMode); }, [speakerMode]);
  useEffect(() => { _lsSet('voicePreset', voicePreset); }, [voicePreset]);
  useEffect(() => { _lsSet('ttsSpeed', ttsSpeed); }, [ttsSpeed]);
  useEffect(() => { _lsSet('contextHint', contextHint); }, [contextHint]);
  useEffect(() => { _lsSet('keepBg', keepBg); }, [keepBg]);
  useEffect(() => { _lsSet('autoDenoise', autoDenoise); }, [autoDenoise]);
  useEffect(() => { _lsSet('lipSync', lipSync); }, [lipSync]);
  useEffect(() => { _lsSet('llmRegroup', llmRegroup); }, [llmRegroup]);
  useEffect(() => { _lsSet('wizardReview', wizardReview); }, [wizardReview]);
  useEffect(() => { _lsSet('qtTrim', qtTrimSeconds); }, [qtTrimSeconds]);
  useEffect(() => { _lsSet('qtLangs', qtLangs); }, [qtLangs]);

  // ── Fetch lip sync status ──
  useEffect(() => {
    fetch('/api/lip_sync/status').then(r => r.json()).then(setLipStatus).catch(() => {});
  }, []);

  // ── Submit handlers ──
  const submitSingle = async () => {
    setError(null); setSubmitting(true);
    const fd = new FormData();
    if (mode === 'file' && videoFile) fd.append('video', videoFile);
    else if (mode === 'url' && ytUrl) fd.append('source', ytUrl);
    if (refFile) fd.append('reference', refFile);
    fd.append('source_lang', srcLang);
    fd.append('target_lang', tgtLang);
    fd.append('model', model);
    fd.append('keep_bg', keepBg);
    fd.append('whisper_model', whisperModel);
    fd.append('speaker_mode', speakerMode);
    fd.append('context_hint', contextHint);
    fd.append('voice_style', voiceStyle);
    fd.append('voice_preset', voicePreset);
    fd.append('tts_speed', ttsSpeed);
    fd.append('wizard_mode', wizardReview ? 'review_translation' : 'auto');
    fd.append('auto_denoise', autoDenoise);
    fd.append('llm_regroup', llmRegroup);
    fd.append('lip_sync', lipSync);
    try {
      const r = await fetch('/api/dub', { method: 'POST', body: fd });
      const d = await r.json();
      if (d.job_id) onJobSubmitted(d.job_id);
      else setError(d.error || d.detail || 'Submit failed');
    } catch (e) {
      setError(String(e.message || e));
    } finally {
      setSubmitting(false);
    }
  };

  const submitBatch = async () => {
    setError(null); setSubmitting(true);
    const fd = new FormData();
    batchFiles.forEach(f => fd.append('videos', f));
    if (batchUrls.trim()) fd.append('sources', batchUrls.trim());
    if (refFile) fd.append('reference', refFile);
    fd.append('source_lang', srcLang);
    fd.append('target_lang', tgtLang);
    fd.append('model', model);
    fd.append('keep_bg', keepBg);
    fd.append('whisper_model', whisperModel);
    fd.append('speaker_mode', speakerMode);
    fd.append('context_hint', contextHint);
    fd.append('voice_style', voiceStyle);
    fd.append('voice_preset', voicePreset);
    fd.append('tts_speed', ttsSpeed);
    fd.append('wizard_mode', 'auto');
    fd.append('auto_denoise', autoDenoise);
    fd.append('llm_regroup', llmRegroup);
    fd.append('batch_label', batchLabel || `Batch ${new Date().toLocaleString()}`);
    if (batchSchedule) {
      const ts = Math.floor(new Date(batchSchedule).getTime() / 1000);
      if (ts > Math.floor(Date.now() / 1000) + 10) fd.append('scheduled_at', String(ts));
    }
    try {
      const r = await fetch('/api/dub/batch', { method: 'POST', body: fd });
      const d = await r.json();
      if (d.batch_id || d.job_ids) onJobSubmitted(null);
      else setError(d.error || d.detail || 'Batch submit failed');
    } catch (e) {
      setError(String(e.message || e));
    } finally {
      setSubmitting(false);
    }
  };

  const submitQuickTest = async () => {
    setError(null); setSubmitting(true);
    const fd = new FormData();
    if (mode === 'file' && videoFile) fd.append('video', videoFile);
    else if (mode === 'url' && ytUrl) fd.append('source', ytUrl);
    if (refFile) fd.append('reference', refFile);
    fd.append('trim_seconds', String(qtTrimSeconds));
    fd.append('target_langs', qtLangs.join(','));
    fd.append('source_lang', srcLang);
    fd.append('model', model);
    fd.append('whisper_model', whisperModel);
    fd.append('speaker_mode', speakerMode);
    fd.append('voice_preset', voicePreset);
    fd.append('voice_style', voiceStyle);
    fd.append('tts_speed', ttsSpeed);
    fd.append('keep_bg', keepBg);
    fd.append('auto_denoise', autoDenoise);
    fd.append('context_hint', contextHint);
    try {
      const r = await fetch('/api/quick_test', { method: 'POST', body: fd });
      const d = await r.json();
      if (d.batch_id || d.job_ids) onJobSubmitted(null);
      else setError(d.error || d.detail || 'Quick-test submit failed');
    } catch (e) {
      setError(String(e.message || e));
    } finally {
      setSubmitting(false);
    }
  };

  const submitShowcase = async () => {
    setError(null); setSubmitting(true);
    const fd = new FormData();
    if (mode === 'file' && videoFile) fd.append('video', videoFile);
    else if (mode === 'url' && ytUrl) fd.append('source', ytUrl);
    if (refFile) fd.append('reference', refFile);
    fd.append('trim_seconds', String(qtTrimSeconds));
    fd.append('target_langs', qtLangs.join(','));
    fd.append('source_lang', srcLang);
    fd.append('model', model);
    fd.append('whisper_model', whisperModel);
    fd.append('speaker_mode', speakerMode);
    fd.append('voice_preset', voicePreset);
    fd.append('voice_style', voiceStyle);
    fd.append('tts_speed', ttsSpeed);
    fd.append('keep_bg', keepBg);
    fd.append('auto_denoise', autoDenoise);
    fd.append('context_hint', contextHint);
    try {
      const r = await fetch('/api/showcase', { method: 'POST', body: fd });
      const d = await r.json();
      if (d.batch_id || d.job_ids) onJobSubmitted(null);
      else setError(d.error || d.detail || 'Showcase submit failed');
    } catch (e) {
      setError(String(e.message || e));
    } finally {
      setSubmitting(false);
    }
  };

  const submit = () => {
    if (showcaseMode) return submitShowcase();
    if (quickTestMode) return submitQuickTest();
    if (batchMode) return submitBatch();
    return submitSingle();
  };

  const canSubmit = !submitting && (
    batchMode
      ? (batchFiles.length + batchUrls.split('\n').filter(l => l.trim()).length) > 0
      : (mode === 'file' ? !!videoFile : !!ytUrl.trim())
  ) && model;

  // ── CTA label ──
  const submitLabel = (() => {
    if (submitting) return 'Submitting…';
    if (batchMode) {
      const c = batchFiles.length + batchUrls.split('\n').filter(l => l.trim()).length;
      if (c === 0) return 'Add at least one source';
      if (batchSchedule) return `Schedule ${c} videos for ${new Date(batchSchedule).toLocaleString()}`;
      return `Queue ${c} videos now`;
    }
    if (mode === 'file' && !videoFile) return 'Choose a video file';
    if (mode === 'url' && !ytUrl.trim()) return 'Paste a URL';
    if (!model) return loadingModels ? 'Loading models…' : 'Select a model';
    return 'Start dubbing';
  })();

  return (
    <div style={{ flex: 1, overflow: 'auto', position: 'relative', background: 'var(--bg)' }}>
      {/* Hero */}
      <Hero sphereOn={sphereOn}/>

      {/* Form */}
      <div style={{ maxWidth: 760, margin: '0 auto', padding: '0 32px 80px' }}>
        {error && (
          <div style={{
            margin: '0 0 24px',
            padding: '12px 14px',
            background: 'oklch(0.7 0.2 25 / 0.08)',
            border: '1px solid oklch(0.7 0.2 25 / 0.3)',
            borderRadius: 8, display: 'flex', alignItems: 'center', gap: 10,
          }}>
            <span style={{ color: 'var(--err)' }}>{I.cancel}</span>
            <div style={{ flex: 1, fontSize: 12.5, color: 'var(--ink)' }}>{error}</div>
            <button className="btn-ghost" style={{ padding: 4, color: 'var(--ink-3)' }} onClick={() => setError(null)}>{I.cancel}</button>
          </div>
        )}

        <SectionHeader index={1} title="Source media" subtitle="One file or batch · file upload or URL"/>

        <div style={{ display: 'flex', gap: 6, marginBottom: 16, flexWrap: 'wrap' }}>
          <ModeBtn active={!batchMode && !quickTestMode && !showcaseMode} onClick={() => switchTo('single')} label="Single video"/>
          <ModeBtn active={batchMode}     onClick={() => switchTo('batch')}    label="Batch — many videos"/>
          <ModeBtn active={quickTestMode} onClick={() => switchTo('quick')}    label="Quick test · multi-lang"/>
          <ModeBtn active={showcaseMode}  onClick={() => switchTo('showcase')} label="Showcase · stitched reel"/>
        </div>

        {showcaseMode && (
          <QuickTestForm
            kind="showcase"
            mode={mode} setMode={setMode}
            videoFile={videoFile} setVideoFile={setVideoFile}
            ytUrl={ytUrl} setYtUrl={setYtUrl}
            refFile={refFile}
            voicePreset={voicePreset}
            ttsSpeed={ttsSpeed}
            trimSeconds={qtTrimSeconds} setTrimSeconds={setQtTrimSeconds}
            langs={qtLangs} setLangs={setQtLangs}
            onSubmit={submitShowcase}
            submitting={submitting}
            error={error}/>
        )}

        {quickTestMode && (
          <QuickTestForm
            mode={mode} setMode={setMode}
            videoFile={videoFile} setVideoFile={setVideoFile}
            ytUrl={ytUrl} setYtUrl={setYtUrl}
            refFile={refFile}
            voicePreset={voicePreset}
            ttsSpeed={ttsSpeed}
            trimSeconds={qtTrimSeconds} setTrimSeconds={setQtTrimSeconds}
            langs={qtLangs} setLangs={setQtLangs}
            onSubmit={submitQuickTest}
            submitting={submitting}
            error={error}
          />
        )}

        {!quickTestMode && !showcaseMode && (<>
        {!batchMode && (
          <SingleSource
            mode={mode} setMode={setMode}
            videoFile={videoFile} setVideoFile={setVideoFile}
            ytUrl={ytUrl} setYtUrl={setYtUrl}
          />
        )}
        {batchMode && (
          <BatchSource
            files={batchFiles} setFiles={setBatchFiles}
            urls={batchUrls} setUrls={setBatchUrls}
          />
        )}

        <SectionHeader index={2} title="Languages & models"/>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14, marginBottom: 14 }}>
          <Field label="Source language">
            <Select value={srcLang} onChange={setSrcLang}>
              {LANGS.map(l => <option key={l.c} value={l.c} style={{ background: '#16161c' }}>{l.n}</option>)}
            </Select>
          </Field>
          <Field label="Target language">
            <Select value={tgtLang} onChange={setTgtLang}>
              {LANGS.filter(l => l.c !== 'auto').map(l => <option key={l.c} value={l.c} style={{ background: '#16161c' }}>{l.n}</option>)}
            </Select>
          </Field>
          <Field label="Translation model" hint={
            loadingModels ? 'Loading models from LM Studio…' :
            translationBackend === 'lm_studio' ? `LM Studio · ${availableModels.length} models available` :
            'Ollama'
          }>
            <Select value={model} onChange={setModel}>
              {loadingModels ? (
                <option value="" style={{ background: '#16161c' }}>Loading models…</option>
              ) : availableModels.length === 0 ? (
                <option value="" style={{ background: '#16161c' }}>
                  {translationBackend === 'lm_studio' ? 'No models found — check LM Studio' : 'No Ollama models found'}
                </option>
              ) : availableModels.map(m => (
                <option key={m} value={m} style={{ background: '#16161c' }}>{m}</option>
              ))}
            </Select>
          </Field>
          <Field label="Whisper model" hint="base = fastest, large-v3 = best quality">
            <Select value={whisperModel} onChange={setWhisperModel}>
              {WHISPER_MODELS.map(m => <option key={m.id} value={m.id} style={{ background: '#16161c' }}>{m.name} · {m.size} · {m.detail}</option>)}
            </Select>
          </Field>
        </div>

        <SectionHeader index={3} title="Voice"/>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8, marginBottom: 12 }}>
          {[
            ['main', 'Main speaker only', 'Best for solo videos · one consistent voice'],
            ['all',  'All speakers',       'Clone every detected voice'],
          ].map(([v, label, hint]) => (
            <button key={v} onClick={() => setSpeakerMode(v)} style={{
              padding: '10px 14px', borderRadius: 6, textAlign: 'left',
              cursor: 'pointer', transition: 'all 0.15s',
              background: speakerMode === v ? 'var(--bg-2)' : 'var(--bg-1)',
              border: '1px solid ' + (speakerMode === v ? 'var(--accent)' : 'var(--line)'),
              color: 'var(--ink)',
            }}>
              <div style={{ fontSize: 12.5, fontWeight: 500 }}>{label}</div>
              <div className="mono" style={{ fontSize: 10, color: 'var(--ink-3)', marginTop: 2 }}>{hint}</div>
            </button>
          ))}
        </div>
        <Field label="Voice preset" hint="Auto-clone uses each speaker's extracted reference. Pick a preset to override.">
          <Select value={voicePreset} onChange={setVoicePreset}>
            <option value="auto" style={{ background: '#16161c' }}>auto · clone source</option>
            {voicePresets.map(p => (
              <option key={p.id} value={p.id} style={{ background: '#16161c' }}>
                {p.name}{p.style ? ' · ' + p.style : ''}{p.type === 'file' ? ' · file' : ''}
              </option>
            ))}
          </Select>
        </Field>
        <div style={{ marginTop: 14 }}>
          <Field label="TTS speed">
            <div style={{ display: 'flex', gap: 6 }}>
              {['fast', 'balanced', 'quality'].map(s => (
                <button key={s} onClick={() => setTtsSpeed(s)} className="btn" style={{
                  flex: 1, justifyContent: 'center',
                  borderColor: ttsSpeed === s ? 'var(--accent)' : 'var(--line)',
                  background: ttsSpeed === s ? 'var(--bg-2)' : 'var(--bg-1)',
                  color: ttsSpeed === s ? 'var(--ink)' : 'var(--ink-2)',
                }}>{s}</button>
              ))}
            </div>
          </Field>
        </div>
        <div style={{ marginTop: 14 }}>
          <Field label="Voice reference (optional)" hint="WAV or MP3. 10-30s of clean speech.">
            <FileSlot file={refFile} setFile={setRefFile} accept="audio/*,video/*"/>
          </Field>
        </div>

        <SectionHeader index={4} title="Advanced"/>
        <Toggle value={keepBg}     onChange={setKeepBg}     label="Keep background audio (music / SFX)" hint="Uses audio-separator. Install required — see System."/>
        <Toggle value={autoDenoise} onChange={setAutoDenoise} label="Auto-denoise audio" hint="+3-5s · ON for noisy footage (mat sounds, crowd, AC hum) · OFF for clean studio audio"/>
        <Toggle value={lipSync} onChange={setLipSync}
                disabled={lipStatus && !lipStatus.installed}
                label={'Sync lips with Wav2Lip' + (lipStatus && !lipStatus.installed ? ' (not installed)' : '')}
                hint={lipStatus && !lipStatus.installed
                  ? 'Wav2Lip not detected. Install via System tab to enable. Adds 2-5x video duration to processing time.'
                  : 'Auto-runs Wav2Lip after dubbing. Best for talking-head footage; fails on action shots or far-away faces. Adds 2-5x video duration.'}/>
        <Toggle value={llmRegroup}  onChange={setLlmRegroup}  label="LLM segment regrouping" hint="+20-40s on long videos · fixes mid-sentence breaks · best for podcasts, lectures, seminars"/>
        <Toggle value={wizardReview} onChange={setWizardReview} label="Wizard mode — pause for review" hint="Pause after translation so you can edit segments and replace voice references."/>

        <div style={{ marginTop: 14 }}>
          <Field label="Translation context (optional)" hint="A short hint for the LLM. Examples: 'BJJ grappling seminar', 'tech podcast', 'cooking show'.">
            <input
              className="field"
              value={contextHint}
              onChange={e => setContextHint(e.target.value)}
              placeholder="e.g. BJJ seminar, tech podcast"
            />
          </Field>
        </div>

        {batchMode && (
          <>
            <SectionHeader index={5} title="Batch options"/>
            <Field label="Batch label (optional)">
              <input
                className="field"
                value={batchLabel}
                onChange={e => setBatchLabel(e.target.value)}
                placeholder="e.g. BJJ Course · Week 1"
              />
            </Field>
            <div style={{ marginTop: 14 }}>
              <Field label="Schedule start (optional)" hint="Empty = start now. Set to run overnight on cheap GPU hours.">
                <input
                  className="field"
                  type="datetime-local"
                  value={batchSchedule}
                  onChange={e => setBatchSchedule(e.target.value)}
                />
              </Field>
            </div>
          </>
        )}

        <div style={{ marginTop: 36, display: 'flex', gap: 10, alignItems: 'center' }}>
          <button onClick={submit} disabled={!canSubmit} className="btn btn-primary" style={{
            flex: 1, justifyContent: 'center', padding: '12px 16px', fontSize: 13,
          }}>
            {submitLabel} {canSubmit && I.arrow}
          </button>
          <span className="mono" style={{ fontSize: 10, color: 'var(--ink-4)' }}>⌘↵</span>
        </div>
        </>)}
      </div>
    </div>
  );
}

// ── Hero ──
function Hero({ sphereOn }) {
  const ref = useRef(null);
  useEffect(() => {
    if (!ref.current || !sphereOn) return;
    return mountSphere(ref.current, { variant: 'idle', size: 220 });
  }, [sphereOn]);

  return (
    <div style={{
      maxWidth: 760, margin: '0 auto',
      padding: '52px 32px 32px',
      display: 'flex', alignItems: 'flex-start', gap: 36,
    }}>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div className="caps" style={{ marginBottom: 12 }}>New dub</div>
        <h1 className="serif" style={{
          fontSize: 'clamp(30px, 9vw, 48px)', lineHeight: 1.02, letterSpacing: '-0.02em', marginBottom: 14,
        }}>
          Voice it back, <span style={{ fontStyle: 'italic', color: 'var(--ink-3)' }}>line by line</span>.
        </h1>
        <div style={{ fontSize: 13.5, color: 'var(--ink-2)', lineHeight: 1.55, maxWidth: 480 }}>
          Local, GPU-accelerated dubbing. WhisperX listens, Ollama translates, VoxCPM speaks.
          Drop a file or paste a URL below.
        </div>
      </div>
      {sphereOn && (
        <div ref={ref} style={{ width: 220, height: 220, flexShrink: 0, pointerEvents: 'none' }}/>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
// STAGE PANEL — per-stage state, artifacts, timings and retry
// ═══════════════════════════════════════════════════════════════════
// Mirrors GET /api/dub/{id}/stages. Every stage the backend checkpoints
// shows up here with what it produced, how long it took, what it cost in
// CPU/GPU, and a Retry control that re-runs *only* that stage onward.
const STAGE_STATE_META = {
  done:    { color: 'var(--accent)', label: 'done' },
  stale:   { color: 'var(--warn)',   label: 'stale' },
  failed:  { color: 'var(--err)',    label: 'failed' },
  running: { color: 'var(--accent)', label: 'running' },
  pending: { color: 'var(--ink-4)',  label: 'pending' },
};

const fmtDur = (s) => {
  if (s === null || s === undefined) return '—';
  if (s < 1) return `${Math.round(s * 1000)}ms`;
  if (s < 60) return `${s.toFixed(1)}s`;
  const m = Math.floor(s / 60);
  return `${m}m ${Math.round(s % 60).toString().padStart(2, '0')}s`;
};

// Compact "what did this stage cost" line. Peaks matter more than averages
// here — a stage that pins the GPU for 3 of its 40 seconds is a very
// different problem from one that holds it the whole time, and seeing both
// numbers side by side is what makes that visible.
const resSummary = (r) => {
  if (!r) return [];
  const out = [];
  if (r.cpu_proc_pct_avg !== undefined)
    out.push({ k: 'cpu', v: `${Math.round(r.cpu_proc_pct_avg)}% avg · ${Math.round(r.cpu_proc_pct_peak)}% peak` });
  if (r.gpu_util_pct_avg !== undefined)
    out.push({ k: 'gpu', v: `${Math.round(r.gpu_util_pct_avg)}% avg · ${Math.round(r.gpu_util_pct_peak)}% peak` });
  if (r.gpu_mem_mb_peak !== undefined) {
    const tot = r.gpu_mem_total_mb;
    out.push({ k: 'vram', v: `${(r.gpu_mem_mb_peak / 1024).toFixed(1)} GB${tot ? ` / ${(tot / 1024).toFixed(0)} GB` : ''} peak` });
  }
  if (r.rss_mb_peak !== undefined)
    out.push({ k: 'ram', v: `${(r.rss_mb_peak / 1024).toFixed(1)} GB peak` });
  return out;
};

function StageDot({ state }) {
  const meta = STAGE_STATE_META[state] || STAGE_STATE_META.pending;
  return (
    <span
      className="dot"
      style={{
        background: meta.color,
        boxShadow: state === 'running' ? `0 0 8px ${meta.color}` : 'none',
        animation: state === 'running' ? 'pulse 1.2s ease-in-out infinite' : 'none',
        flexShrink: 0,
      }}
    />
  );
}

// Horizontal breakdown of where wall-clock time actually went. Stages with
// no recorded duration are skipped rather than drawn as slivers.
function StageTimeline({ stages, total }) {
  const timed = stages.filter(s => s.duration_sec > 0);
  if (!total || timed.length === 0) return null;
  // Trust the summed durations over the reported total: rounding on the
  // server can otherwise push a single short stage past 100%.
  const sum = timed.reduce((a, s) => a + s.duration_sec, 0);
  const denom = Math.max(sum, total);
  return (
    <div style={{ marginTop: 10 }}>
      <div style={{ display: 'flex', height: 6, borderRadius: 3, overflow: 'hidden', background: 'var(--bg-3)' }}>
        {timed.map((s, i) => (
          <div
            key={s.id}
            title={`${s.label}: ${fmtDur(s.duration_sec)} (${Math.round(s.duration_sec / denom * 100)}%)`}
            style={{
              width: `${(s.duration_sec / denom) * 100}%`,
              background: i % 2 ? 'var(--accent)' : 'var(--accent-glow)',
              borderRight: '1px solid var(--bg-1)',
            }}
          />
        ))}
      </div>
      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 10, marginTop: 6 }}>
        {timed.map(s => (
          <span key={s.id} className="mono" style={{ color: 'var(--ink-3)', fontSize: 10 }}>
            {s.label} {Math.round(s.duration_sec / denom * 100)}%
          </span>
        ))}
      </div>
    </div>
  );
}

function RetryOption({ opt, value, onChange, models, voicePresets }) {
  const common = { fontSize: 12 };
  let control;
  if (opt.type === 'bool') {
    control = (
      <label style={{ display: 'inline-flex', alignItems: 'center', gap: 7, cursor: 'pointer' }}>
        <input
          type="checkbox"
          checked={!!value}
          onChange={e => onChange(opt.key, e.target.checked)}
          style={{ width: 14, height: 14, accentColor: 'var(--accent)', cursor: 'pointer' }}
        />
        <span style={{ color: 'var(--ink-2)', ...common }}>{opt.label}</span>
      </label>
    );
  } else if (opt.type === 'select' || opt.type === 'model' || opt.type === 'voice') {
    // 'model' and 'voice' are 'select' whose choices come from live server
    // state rather than being hard-coded in the stage definition.
    const choices = opt.type === 'model' ? models
      : opt.type === 'voice' ? voicePresets.map(p => p.id)
      : (opt.choices || []);
    control = (
      <div>
        <div className="caps" style={{ marginBottom: 4 }}>{opt.label}</div>
        <select
          className="field"
          value={value === undefined ? '' : value}
          onChange={e => onChange(opt.key, e.target.value || undefined)}
          style={{ ...common, minWidth: 160 }}
        >
          <option value="">— unchanged —</option>
          {choices.map(c => <option key={c} value={c}>{c}</option>)}
        </select>
      </div>
    );
  } else {
    control = (
      <div>
        <div className="caps" style={{ marginBottom: 4 }}>{opt.label}</div>
        <input
          className="field"
          value={value === undefined ? '' : value}
          placeholder="unchanged"
          onChange={e => onChange(opt.key, e.target.value || undefined)}
          style={{ ...common, minWidth: 200 }}
        />
      </div>
    );
  }
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 3 }}>
      {control}
      {opt.hint && (
        <div style={{ fontSize: 10.5, color: 'var(--ink-3)', maxWidth: 260, lineHeight: 1.4 }}>
          {opt.hint}
        </div>
      )}
    </div>
  );
}

function StageRow({ stage, allStages, jobId, models, voicePresets, onRetried }) {
  const [open, setOpen] = useState(false);
  const [opts, setOpts] = useState({});
  const [stopAfter, setStopAfter] = useState('');
  const [sending, setSending] = useState(false);
  const [err, setErr] = useState('');
  const meta = STAGE_STATE_META[stage.state] || STAGE_STATE_META.pending;
  const res = resSummary(stage.resources);
  // `notices` lives inside detail too; it renders as its own block below, so
  // keep it out of the k=v line where it would print as [object Object].
  const detailPairs = Object.entries(stage.detail || {}).filter(([k]) => k !== 'notices');

  const setOpt = (k, v) => setOpts(o => {
    const next = { ...o };
    if (v === undefined || v === '') delete next[k]; else next[k] = v;
    return next;
  });

  const submit = async () => {
    setSending(true); setErr('');
    try {
      const fd = new FormData();
      fd.append('overrides', JSON.stringify(opts));
      if (stopAfter) fd.append('stop_after', stopAfter);
      const r = await fetch(`/api/dub/${jobId}/retry_stage/${stage.id}`, { method: 'POST', body: fd });
      const d = await r.json();
      if (!r.ok) { setErr(d.error || `HTTP ${r.status}`); }
      else { setOpen(false); setOpts({}); setStopAfter(''); onRetried && onRetried(); }
    } catch (e) {
      setErr(String(e));
    } finally {
      setSending(false);
    }
  };

  // Stopping "after" only makes sense at or beyond this stage.
  const laterStages = allStages.filter(s => s.index >= stage.index);

  return (
    <div style={{
      borderTop: '1px solid var(--line)',
      padding: '10px 0',
      opacity: stage.state === 'pending' ? 0.55 : 1,
    }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
        <StageDot state={stage.state}/>
        <div style={{ minWidth: 96, fontWeight: 500 }}>{stage.label}</div>
        <div className="mono" style={{ color: meta.color, minWidth: 58, fontSize: 10.5 }}>
          {meta.label}
        </div>
        {stage.degraded && (
          <span className="mono" title="Finished, but not the way you'd expect"
                style={{ fontSize: 10, color: 'var(--warn)' }}>⚠ degraded</span>
        )}
        <div className="mono" style={{ minWidth: 62, color: 'var(--ink-2)' }}>
          {fmtDur(stage.duration_sec)}
        </div>
        {stage.attempt > 1 && (
          <span className="chip" style={{ fontSize: 10, padding: '1px 6px' }}>
            attempt {stage.attempt}
          </span>
        )}
        <div style={{ flex: 1 }}/>
        {stage.can_retry && (
          <button
            className={'btn btn-ghost'}
            style={{ padding: '4px 9px', fontSize: 11.5 }}
            onClick={() => setOpen(o => !o)}
          >
            {open ? 'Cancel' : (stage.state === 'failed' ? 'Retry stage' : 'Re-run')}
          </button>
        )}
      </div>

      {/* Resource + artifact strip */}
      {(res.length > 0 || stage.artifacts.length > 0 || stage.error) && (
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, marginTop: 6, paddingLeft: 16, alignItems: 'center' }}>
          {res.map(r => (
            <span key={r.k} className="mono" style={{ fontSize: 10, color: 'var(--ink-3)' }}>
              <span style={{ color: 'var(--ink-4)' }}>{r.k}</span> {r.v}
            </span>
          ))}
          {stage.artifacts.map(a => (
            a.url ? (
              <a key={a.label} href={a.url} target="_blank" rel="noreferrer" className="chip"
                 style={{ fontSize: 10, padding: '1px 7px', textDecoration: 'none' }}>
                {a.name}{a.is_dir ? ` · ${a.file_count} files` : ''}
                {a.size_mb !== null ? ` · ${a.size_mb} MB` : ''}
              </a>
            ) : (
              <span key={a.label} className="chip" style={{ fontSize: 10, padding: '1px 7px', opacity: 0.6 }}>
                {a.name}{a.exists ? '' : ' · missing'}
              </span>
            )
          ))}
        </div>
      )}
      {detailPairs.length > 0 && (
        <div className="mono" style={{ fontSize: 10, color: 'var(--ink-4)', marginTop: 4, paddingLeft: 16 }}>
          {detailPairs.map(([k, v]) => `${k}=${v}`).join('  ')}
        </div>
      )}
      {/* Degraded: the stage succeeded but not the way the user assumes.
          Sits above the error box so "done ⚠" reads top-down. */}
      {(stage.notices || []).map(n => (
        <div key={n.code} style={{ marginTop: 6, marginLeft: 16, padding: '7px 9px', borderRadius: 5,
                      background: sevMeta(n.severity).bg,
                      border: '1px solid ' + sevMeta(n.severity).line,
                      fontSize: 11, lineHeight: 1.5 }}>
          <div style={{ color: sevMeta(n.severity).color }}>{n.title}</div>
          {n.remediation?.length > 0 && (
            <div className="mono" style={{ fontSize: 10, color: 'var(--ink-2)', marginTop: 3 }}>
              {n.remediation[0]}
            </div>
          )}
          {n.url && (
            <a href={n.url} target="_blank" rel="noreferrer" className="mono"
               style={{ fontSize: 10, color: sevMeta(n.severity).color, marginTop: 3, display: 'inline-block' }}>
              {n.url.replace(/^https?:\/\//, '')} ↗
            </a>
          )}
        </div>
      ))}
      {stage.error && (
        <div style={{ marginTop: 6, marginLeft: 16, padding: '6px 8px', borderRadius: 5,
                      background: 'oklch(0.7 0.2 25 / 0.1)', border: '1px solid oklch(0.7 0.2 25 / 0.25)',
                      color: 'var(--err)', fontSize: 11, lineHeight: 1.45 }}>
          {stage.error}
        </div>
      )}

      {/* Retry form */}
      {open && (
        <div style={{
          marginTop: 10, marginLeft: 16, padding: 12,
          background: 'var(--bg-2)', border: '1px solid var(--line)', borderRadius: 8,
          animation: 'slideUp 0.15s ease-out',
        }}>
          <div className="caps" style={{ marginBottom: 8 }}>
            Re-run from “{stage.label}”
          </div>
          <div style={{ fontSize: 11.5, color: 'var(--ink-3)', marginBottom: 12, lineHeight: 1.5 }}>
            Loads the checkpoint from the previous stage and runs forward.
            Everything before {stage.label.toLowerCase()} is reused as-is.
          </div>
          {stage.options.length > 0 && (
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 16, marginBottom: 12 }}>
              {stage.options.map(o => (
                <RetryOption key={o.key} opt={o} value={opts[o.key]} onChange={setOpt}
                             models={models} voicePresets={voicePresets}/>
              ))}
            </div>
          )}
          <div style={{ display: 'flex', alignItems: 'flex-end', gap: 12, flexWrap: 'wrap' }}>
            <div>
              <div className="caps" style={{ marginBottom: 4 }}>Stop after</div>
              <select className="field" value={stopAfter} onChange={e => setStopAfter(e.target.value)}
                      style={{ fontSize: 12, minWidth: 150 }}>
                <option value="">Run to the end</option>
                {laterStages.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
              </select>
            </div>
            <button className="btn btn-primary" disabled={sending} onClick={submit}>
              {sending ? 'Queueing…' : 'Run'}
            </button>
          </div>
          {err && (
            <div style={{ marginTop: 8, color: 'var(--err)', fontSize: 11.5 }}>{err}</div>
          )}
        </div>
      )}
    </div>
  );
}

function StagePanel({ jobId, system, voicePresets, onChanged, defaultOpen = true }) {
  const [data, setData] = useState(null);
  const [expanded, setExpanded] = useState(defaultOpen);
  const [loadErr, setLoadErr] = useState('');

  const load = React.useCallback(async () => {
    if (!jobId) return;
    try {
      const r = await fetch(`/api/dub/${jobId}/stages`);
      if (!r.ok) { setLoadErr(`HTTP ${r.status}`); return; }
      setData(await r.json());
      setLoadErr('');
    } catch (e) { setLoadErr(String(e)); }
  }, [jobId]);

  // Poll fast while the pipeline owns the job, slowly once it's at rest —
  // this panel is open on the Result/History screens too, where nothing
  // changes until the user asks for a retry.
  useEffect(() => {
    if (!expanded) return;
    load();
    const t = setInterval(load, data && data.busy ? 2000 : 10000);
    return () => clearInterval(t);
  }, [load, expanded, data && data.busy]);

  const models = React.useMemo(() => {
    if (!system) return [];
    const ollama = (system.ollama && system.ollama.models) || [];
    const lms = (system.lm_studio && system.lm_studio.models) || [];
    return Array.from(new Set([...ollama, ...lms]));
  }, [system]);

  if (!jobId) return null;

  return (
    <div className="panel" style={{ padding: 16, width: '100%' }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, cursor: 'pointer' }}
           onClick={() => setExpanded(e => !e)}>
        <div className="caps">Pipeline stages</div>
        <div style={{ flex: 1 }}/>
        {data && (
          <React.Fragment>
            <span className="mono" style={{ color: 'var(--ink-3)', fontSize: 10.5 }}>
              total {fmtDur(data.total_duration_sec)}
            </span>
            <span className="mono" style={{ color: 'var(--ink-4)', fontSize: 10.5 }}>
              gpu probe: {data.gpu_backend || 'none'}
            </span>
          </React.Fragment>
        )}
        <span style={{ color: 'var(--ink-3)', fontSize: 11 }}>{expanded ? '▾' : '▸'}</span>
      </div>

      {expanded && !data && (
        <div style={{ color: 'var(--ink-3)', marginTop: 12, fontSize: 12 }}>
          {loadErr ? `Could not load stages — ${loadErr}` : 'Loading stages…'}
        </div>
      )}

      {expanded && data && (
        <div style={{ marginTop: 4 }}>
          <StageTimeline stages={data.stages} total={data.total_duration_sec}/>
          {data.busy && (
            <div style={{ marginTop: 10, fontSize: 11.5, color: 'var(--warn)' }}>
              Job is {data.job_status} — cancel it to re-run a stage.
            </div>
          )}
          <div style={{ marginTop: 8 }}>
            {data.stages.map(s => (
              <StageRow
                key={s.id} stage={s} allStages={data.stages} jobId={jobId}
                models={models} voicePresets={voicePresets || []}
                onRetried={() => { load(); onChanged && onChanged(); }}
              />
            ))}
          </div>
          {data.stages.some(s => s.state === 'stale') && (
            <div style={{ marginTop: 10, fontSize: 11, color: 'var(--warn)', lineHeight: 1.5 }}>
              Stages marked <strong>stale</strong> ran before an earlier stage was
              re-done — their output no longer reflects the current input. Re-run
              them (or any stage above) to refresh.
            </div>
          )}
        </div>
      )}
    </div>
  );
}
