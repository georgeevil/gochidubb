<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TachiDUBB Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0d;
    --bg-1: #101014;
    --bg-2: #16161c;
    --bg-3: #1d1d25;
    --line: #24242e;
    --line-2: #2f2f3c;
    --ink: #ece9e0;
    --ink-2: #a3a096;
    --ink-3: #5a5a63;
    --ink-4: #35353d;
    --accent: oklch(0.88 0.18 125);
    --accent-dim: oklch(0.88 0.18 125 / 0.15);
    --accent-glow: oklch(0.88 0.18 125 / 0.4);
    --warn: oklch(0.78 0.15 60);
    --err: oklch(0.7 0.2 25);
    --serif: 'Instrument Serif', ui-serif, Georgia, serif;
    --sans: 'Geist', ui-sans-serif, system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 400;
    letter-spacing: -0.005em;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow: hidden;
  }
  #root { width: 100vw; height: 100vh; }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--ink-4); }

  button { font-family: inherit; font-size: inherit; color: inherit; background: none; border: none; cursor: pointer; letter-spacing: inherit; }
  input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; background: transparent; border: none; outline: none; }

  .serif { font-family: var(--serif); font-weight: 400; letter-spacing: -0.01em; }
  .mono { font-family: var(--mono); font-size: 11px; letter-spacing: -0.01em; }
  .caps { font-size: 10px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.04;
    z-index: 9999;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.8'/%3E%3C/svg%3E");
  }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 7px 12px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--bg-1);
    color: var(--ink-2);
    font-size: 12px;
    font-weight: 500;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--line-2); color: var(--ink); background: var(--bg-2); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn:disabled:hover { border-color: var(--line); color: var(--ink-2); background: var(--bg-1); }
  .btn-primary {
    background: var(--accent);
    color: #0a0a0d;
    border-color: var(--accent);
    font-weight: 600;
  }
  .btn-primary:hover { filter: brightness(1.1); border-color: var(--accent); color: #0a0a0d; background: var(--accent); }
  .btn-primary:disabled { background: var(--bg-2); color: var(--ink-3); border-color: var(--line); }
  .btn-primary:disabled:hover { filter: none; }
  .btn-ghost { border-color: transparent; background: transparent; }
  .btn-ghost:hover { border-color: var(--line); background: var(--bg-1); }

  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 8px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--bg-1);
    color: var(--ink-2);
    font-size: 11px;
    font-weight: 500;
  }
  .chip.accent { color: var(--accent); border-color: var(--accent-dim); background: var(--accent-dim); }

  .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
  .panel { background: var(--bg-1); border: 1px solid var(--line); border-radius: 10px; }

  .field {
    padding: 8px 10px;
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--ink);
    transition: border-color 0.12s;
    width: 100%;
    font-size: 12.5px;
  }
  .field:hover { border-color: var(--line-2); }
  .field:focus { border-color: var(--accent); }

  .tab {
    padding: 8px 2px;
    color: var(--ink-3);
    font-size: 12px;
    font-weight: 500;
    border-bottom: 1px solid transparent;
    cursor: pointer;
    transition: color 0.12s, border-color 0.12s;
  }
  .tab:hover { color: var(--ink-2); }
  .tab.active { color: var(--ink); border-bottom-color: var(--accent); }

  .scroll { overflow-y: auto; overflow-x: hidden; }
  .scroll::-webkit-scrollbar { width: 4px; }

  .dropzone {
    border: 1px dashed var(--line-2);
    border-radius: 10px;
    padding: 28px 20px;
    text-align: center;
    background: var(--bg-1);
    cursor: pointer;
    transition: all 0.15s;
  }
  .dropzone:hover { border-color: var(--accent-dim); background: var(--bg-2); }
  .dropzone.dragging { border-color: var(--accent); background: var(--accent-dim); }
</style>
</head>

const fmtSec = (s) => {
  if (!s && s !== 0) return '—';
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = Math.floor(s % 60);
  if (h > 0) return `${h}:${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
  return `${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
};

const fmtAge = (ts) => {
  if (!ts) return '';
  const now = Date.now() / 1000;
  const d = now - ts;
  if (d < 60) return 'just now';
  if (d < 3600) return Math.floor(d / 60) + 'm ago';
  if (d < 86400) return Math.floor(d / 3600) + 'h ago';
  if (d < 7 * 86400) return Math.floor(d / 86400) + 'd ago';
  const dt = new Date(ts * 1000);
  return dt.toLocaleDateString();
};

const _lsGet = (key, fallback) => {

    if (v === null) return fallback;
    if (v === 'true') return true;
    if (v === 'false') return false;
    return v;
  } catch (_) { return fallback; }
};
const _lsSet = (key, v) => {
  try { localStorage.setItem('tachidubb_pref_' + key, String(v)); } catch (_) {}
};

// ═══════════════════════════════════════════════════════════════════
// SPHERE COMPONENT (simplified)
// ═══════════════════════════════════════════════════════════════════
function mountSphere(el, opts) {
  const { variant = 'idle', size = 220 } = opts || {};
  if (!el || typeof THREE === 'undefined') {
    el.innerHTML = `<div style="width:${size}px;height:${size}px;border-radius:50%;
      border:1px solid var(--line-2);background:radial-gradient(circle at 30% 30%,
      var(--bg-2),var(--bg) 70%);"></div>`;
    return () => { el.innerHTML = ''; };
  }
  const palette = variant === 'live'
    ? { core: 0xccff66, rim: 0x88dd44, breath: 1.6 }
    : { core: 0x9ab4d4, rim: 0x5a7094, breath: 3.2 };

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
  camera.position.set(0, 0, 5.2);
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 0);
  renderer.setSize(size, size);
  el.appendChild(renderer.domElement);

  const geo = new THREE.IcosahedronGeometry(1.4, 3);
  const mat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uCore: { value: new THREE.Color(palette.core) }, uRim: { value: new THREE.Color(palette.rim) } },
    vertexShader: `
      varying vec3 vNormal; varying vec3 vPos;
      uniform float uTime;
      float noise(vec3 p) {
        return sin(p.x*2.0+uTime*0.7)*0.5 + cos(p.y*1.7+uTime*0.5)*0.5 + sin(p.z*2.3+uTime*0.6)*0.3;
      }
      void main() {
        vNormal = normal; vPos = position;
        float n = noise(position*0.8) * 0.12;
        vec3 d = position + normal * n;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(d, 1.0);
      }`,
    fragmentShader: `
      varying vec3 vNormal; varying vec3 vPos;
      uniform vec3 uCore; uniform vec3 uRim; uniform float uTime;
      void main() {
        vec3 view = normalize(cameraPosition - vPos);
        float rim = pow(1.0 - max(dot(vNormal, view), 0.0), 2.2);
        float pulse = 0.5 + 0.5 * sin(uTime * 0.5);
        vec3 col = mix(uCore * 0.25, uRim, rim);
        col *= 0.8 + pulse * 0.3;
        gl_FragColor = vec4(col, 0.95);
      }`,
    transparent: true, depthWrite: false,
  });
  const mesh = new THREE.Mesh(geo, mat);
  scene.add(mesh);
  const halo = new THREE.Mesh(
    new THREE.IcosahedronGeometry(1.7, 2),
    new THREE.MeshBasicMaterial({ color: palette.rim, wireframe: true, transparent: true, opacity: variant === 'live' ? 0.35 : 0.18 })
  );
  scene.add(halo);

  let t0 = performance.now(); let raf;
  const tick = () => {
    const t = (performance.now() - t0) * 0.001;
    mat.uniforms.uTime.value = t * palette.breath;
    mesh.rotation.y = t * 0.12; mesh.rotation.x = Math.sin(t * 0.2) * 0.08;
    halo.rotation.y = -t * 0.06;
    renderer.render(scene, camera);
    raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
  return () => {
    cancelAnimationFrame(raf);
    renderer.dispose(); geo.dispose(); mat.dispose();
    halo.geometry.dispose(); halo.material.dispose();
    if (renderer.domElement.parentNode === el) el.removeChild(renderer.domElement);
  };
}

function Toggle({ value, onChange, label, hint, disabled = false }) {
  const handle = () => { if (!disabled) onChange(!value); };
  return (
    <label style={{
      display: 'flex', alignItems: 'flex-start', gap: 10,
      cursor: disabled ? 'not-allowed' : 'pointer',
      padding: '8px 0',
      opacity: disabled ? 0.5 : 1,

        width: 30, height: 16, borderRadius: 8,
        background: value ? 'var(--accent)' : 'var(--bg-3)',
        position: 'relative', transition: 'background 0.15s',
        border: '1px solid ' + (value ? 'var(--accent)' : 'var(--line-2)'),
        flexShrink: 0, marginTop: 1,
      }}>
        <div style={{
          position: 'absolute', top: 1, left: value ? 14 : 1,

          background: value ? '#0a0a0d' : 'var(--ink-2)',
          transition: 'left 0.15s',
        }}/>

        {hint && <div style={{ fontSize: 11, color: 'var(--ink-3)', marginTop: 2, lineHeight: 1.45 }}>{hint}</div>}
      </div>
    </label>
  );
}

function Field({ label, hint, children }) {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 5 }}>
      {label && <div className="caps">{label}</div>}
      {children}
      {hint && <div style={{ fontSize: 11, color: 'var(--ink-3)', marginTop: 1 }}>{hint}</div>}

}

function Select({ value, onChange, children }) {
  return (
    <select value={value} onChange={e => onChange(e.target.value)} className="field" style={{

function SectionHeader({ index, title, subtitle }) {

function StatusBadge({ status }) {
  const m = STATUS_META[status] || { color: 'var(--ink-3)', label: status };
  const pulse = ACTIVE_STATUSES.has(status);
  return (
    <span style={{
      display: 'inline-flex', alignItems: 'center', gap: 6,
      padding: '3px 8px', borderRadius: 999,
      border: '1px solid ' + m.color + '40',
      background: m.color + '14', color: m.color,
      fontSize: 11, fontWeight: 500,
      animation: pulse ? 'pulse 1.4s infinite' : 'none',

      <span className="dot" style={{ background: m.color }}/>
      {m.label}

}

function LongProgress({ value, color = 'var(--accent)', height = 3 }) {
  const v = Math.max(0, Math.min(1, value || 0));
  return (
    <div style={{ height, background: 'var(--bg-3)', borderRadius: height / 2, overflow: 'hidden' }}>
      <div style={{
        height: '100%', width: (v * 100).toFixed(1) + '%', background: color,
        transition: 'width 0.4s', borderRadius: height / 2,
      }}/>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
// HOME VIEW — with dynamic model loading
// ═══════════════════════════════════════════════════════════════════
function HomeView({ system, voicePresets, sphereOn, onJobSubmitted }) {
  // ── Dynamic models state ──
  const [availableModels, setAvailableModels] = useState([]);
  const [translationBackend, setTranslationBackend] = useState('lm_studio');
  const [loadingModels, setLoadingModels] = useState(true);

  // ── Form state ──
  const [mode, setMode] = useState('url');
  const [batchMode, setBatchMode] = useState(false);
  const [quickTestMode, setQuickTestMode] = useState(false);
  const [showcaseMode, setShowcaseMode] = useState(false);
  const switchTo = (target) => {
    setBatchMode(target === 'batch');
    setQuickTestMode(target === 'quick');
    setShowcaseMode(target === 'showcase');
  };
  const [videoFile, setVideoFile] = useState(null);
  const [ytUrl, setYtUrl] = useState('');
  const [refFile, setRefFile] = useState(null);
  const [batchFiles, setBatchFiles] = useState([]);
  const [batchUrls, setBatchUrls] = useState('');
  const [batchLabel, setBatchLabel] = useState('');
  const [batchSchedule, setBatchSchedule] = useState('');

  const [srcLang, setSrcLang] = useState(() => _lsGet('srcLang', 'auto'));
  const [tgtLang, setTgtLang] = useState(() => _lsGet('tgtLang', 'ru'));
  const [model, setModel] = useState(() => _lsGet('model', ''));
  const [whisperModel, setWhisperModel] = useState(() => _lsGet('whisperModel', 'base'));
  const [speakerMode, setSpeakerMode] = useState(() => _lsGet('speakerMode', 'main'));
  const [voicePreset, setVoicePreset] = useState(() => _lsGet('voicePreset', 'auto'));
  const [voiceStyle, setVoiceStyle] = useState('');
  const [ttsSpeed, setTtsSpeed] = useState(() => _lsGet('ttsSpeed', 'balanced'));
  const [contextHint, setContextHint] = useState(() => _lsGet('contextHint', ''));
  const [keepBg, setKeepBg] = useState(() => _lsGet('keepBg', false));
  const [autoDenoise, setAutoDenoise] = useState(() => _lsGet('autoDenoise', false));
  const [lipSync, setLipSync] = useState(() => _lsGet('lipSync', false));
  const [llmRegroup, setLlmRegroup] = useState(() => _lsGet('llmRegroup', false));
  const [wizardReview, setWizardReview] = useState(() => _lsGet('wizardReview', false));

  const [qtTrimSeconds, setQtTrimSeconds] = useState(() => _lsGet('qtTrim', 60));
  const [qtLangs, setQtLangs] = useState(() => {
    const stored = _lsGet('qtLangs', null);
    return Array.isArray(stored) && stored.length >= 2 ? stored : ['es', 'fr', 'de', 'ja', 'pt'];
  });

  const [submitting, setSubmitting] = useState(false);
  const [error, setError] = useState(null);
  const [lipStatus, setLipStatus] = useState(null);

  // ── Fetch models dynamically ──
  useEffect(() => {
    const fetchModels = async () => {
      setLoadingModels(true);
      try {
        // First check which backend is active from system
        if (system) {
          const backend = system.translation_backend || 
                         (system.lm_studio?.ok ? 'lm_studio' : 
                          system.ollama?.ok ? 'ollama' : 'unknown');
          setTranslationBackend(backend);
        }

        // Try to fetch models from LM Studio
        const res = await fetch('/api/lm_studio/models');
        if (res.ok) {
          const data = await res.json();
          if (data.models && data.models.length > 0) {
            setAvailableModels(data.models);
            // If no model selected or current model not in list, select first
            if (!model || !data.models.includes(model)) {
              // Prefer Qwen models
              const qwenModel = data.models.find(m => m.toLowerCase().includes('qwen'));
              setModel(qwenModel || data.models[0]);
            }
            setLoadingModels(false);
            return;
          }
        }

        // Fallback: try system endpoint
        if (system) {
          const sysModels = system.lm_studio?.models || system.ollama?.models || [];
          if (sysModels.length > 0) {
            setAvailableModels(sysModels);
            if (!model || !sysModels.includes(model)) {
              const qwenModel = sysModels.find(m => String(m).toLowerCase().includes('qwen'));
              setModel(qwenModel || sysModels[0]);
            }
            setLoadingModels(false);
            return;
          }
        }

        // Final fallback: use known good models
        const fallback = ['Qwen/Qwen2.5-14B-Instruct', 'Qwen/Qwen2.5-7B-Instruct', 'google/gemma-3-12b-it'];
        setAvailableModels(fallback);
        if (!model) setModel(fallback[0]);
        setLoadingModels(false);
      } catch (e) {
        console.warn('Failed to fetch models:', e);
        const fallback = ['Qwen/Qwen2.5-14B-Instruct', 'Qwen/Qwen2.5-7B-Instruct'];
        setAvailableModels(fallback);
        if (!model) setModel(fallback[0]);
        setLoadingModels(false);
      }
    };
    fetchModels();
  }, [system]);

  // ── Persist preferences ──
  useEffect(() => { _lsSet('srcLang', srcLang); }, [srcLang]);
  useEffect(() => { _lsSet('tgtLang', tgtLang); }, [tgtLang]);
  useEffect(() => { _lsSet('model', model); }, [model]);
  useEffect(() => { _lsSet('whisperModel', whisperModel); }, [whisperModel]);
  useEffect(() => { _lsSet('speakerMode', speakerMode); }, [speakerMode]);
  useEffect(() => { _lsSet('voicePreset', voicePreset); }, [voicePreset]);
  useEffect(() => { _lsSet('ttsSpeed', ttsSpeed); }, [ttsSpeed]);
  useEffect(() => { _lsSet('contextHint', contextHint); }, [contextHint]);
  useEffect(() => { _lsSet('keepBg', keepBg); }, [keepBg]);
  useEffect(() => { _lsSet('autoDenoise', autoDenoise); }, [autoDenoise]);
  useEffect(() => { _lsSet('lipSync', lipSync); }, [lipSync]);
  useEffect(() => { _lsSet('llmRegroup', llmRegroup); }, [llmRegroup]);
  useEffect(() => { _lsSet('wizardReview', wizardReview); }, [wizardReview]);
  useEffect(() => { _lsSet('qtTrim', qtTrimSeconds); }, [qtTrimSeconds]);
  useEffect(() => { _lsSet('qtLangs', qtLangs); }, [qtLangs]);

  // ── Fetch lip sync status ──
  useEffect(() => {
    fetch('/api/lip_sync/status').then(r => r.json()).then(setLipStatus).catch(() => {});
  }, []);

  // ── Submit handlers ──
  const submitSingle = async () => {
    setError(null); setSubmitting(true);
    const fd = new FormData();
    if (mode === 'file' && videoFile) fd.append('video', videoFile);
    else if (mode === 'url' && ytUrl) fd.append('source', ytUrl);
    if (refFile) fd.append('reference', refFile);
    fd.append('source_lang', srcLang);
    fd.append('target_lang', tgtLang);
    fd.append('model', model);
    fd.append('keep_bg', keepBg);
    fd.append('whisper_model', whisperModel);
    fd.append('speaker_mode', speakerMode);
    fd.append('context_hint', contextHint);
    fd.append('voice_style', voiceStyle);
    fd.append('voice_preset', voicePreset);
    fd.append('tts_speed', ttsSpeed);
    fd.append('wizard_mode', wizardReview ? 'review_translation' : 'auto');
    fd.append('auto_denoise', autoDenoise);
    fd.append('llm_regroup', llmRegroup);
    fd.append('lip_sync', lipSync);
    try {
      const r = await fetch('/api/dub', { method: 'POST', body: fd });
      const d = await r.json();
      if (d.job_id) onJobSubmitted(d.job_id);
      else setError(d.error || d.detail || 'Submit failed');
    } catch (e) {
      setError(String(e.message || e));
    } finally {
      setSubmitting(false);
    }
  };

  const submitBatch = async () => {
    setError(null); setSubmitting(true);
    const fd = new FormData();
    batchFiles.forEach(f => fd.append('videos', f));
    if (batchUrls.trim()) fd.append('sources', batchUrls.trim());
    if (refFile) fd.append('reference', refFile);
    fd.append('source_lang', srcLang);
    fd.append('target_lang', tgtLang);
    fd.append('model', model);
    fd.append('keep_bg', keepBg);
    fd.append('whisper_model', whisperModel);
    fd.append('speaker_mode', speakerMode);
    fd.append('context_hint', contextHint);
    fd.append('voice_style', voiceStyle);
    fd.append('voice_preset', voicePreset);
    fd.append('tts_speed', ttsSpeed);
    fd.append('wizard_mode', 'auto');
    fd.append('auto_denoise', autoDenoise);
    fd.append('llm_regroup', llmRegroup);
    fd.append('batch_label', batchLabel || `Batch ${new Date().toLocaleString()}`);
    if (batchSchedule) {
      const ts = Math.floor(new Date(batchSchedule).getTime() / 1000);
      if (ts > Math.floor(Date.now() / 1000) + 10) fd.append('scheduled_at', String(ts));
    }
    try {
      const r = await fetch('/api/dub/batch', { method: 'POST', body: fd });
      const d = await r.json();
      if (d.batch_id || d.job_ids) onJobSubmitted(null);
      else setError(d.error || d.detail || 'Batch submit failed');
    } catch (e) {
      setError(String(e.message || e));
    } finally {
      setSubmitting(false);
    }
  };

  const submitQuickTest = async () => {
    setError(null); setSubmitting(true);
    const fd = new FormData();
    if (mode === 'file' && videoFile) fd.append('video', videoFile);
    else if (mode === 'url' && ytUrl) fd.append('source', ytUrl);
    if (refFile) fd.append('reference', refFile);
    fd.append('trim_seconds', String(qtTrimSeconds));
    fd.append('target_langs', qtLangs.join(','));
    fd.append('source_lang', srcLang);
    fd.append('model', model);
    fd.append('whisper_model', whisperModel);
    fd.append('speaker_mode', speakerMode);
    fd.append('voice_preset', voicePreset);
    fd.append('voice_style', voiceStyle);
    fd.append('tts_speed', ttsSpeed);
    fd.append('keep_bg', keepBg);
    fd.append('auto_denoise', autoDenoise);
    fd.append('context_hint', contextHint);
    try {
      const r = await fetch('/api/quick_test', { method: 'POST', body: fd });
      const d = await r.json();
      if (d.batch_id || d.job_ids) onJobSubmitted(null);
      else setError(d.error || d.detail || 'Quick-test submit failed');
    } catch (e) {
      setError(String(e.message || e));
    } finally {
      setSubmitting(false);
    }
  };

  const submitShowcase = async () => {
    setError(null); setSubmitting(true);
    const fd = new FormData();
    if (mode === 'file' && videoFile) fd.append('video', videoFile);
    else if (mode === 'url' && ytUrl) fd.append('source', ytUrl);
    if (refFile) fd.append('reference', refFile);
    fd.append('trim_seconds', String(qtTrimSeconds));
    fd.append('target_langs', qtLangs.join(','));
    fd.append('source_lang', srcLang);
    fd.append('model', model);
    fd.append('whisper_model', whisperModel);
    fd.append('speaker_mode', speakerMode);
    fd.append('voice_preset', voicePreset);
    fd.append('voice_style', voiceStyle);
    fd.append('tts_speed', ttsSpeed);
    fd.append('keep_bg', keepBg);
    fd.append('auto_denoise', autoDenoise);
    fd.append('context_hint', contextHint);
    try {
      const r = await fetch('/api/showcase', { method: 'POST', body: fd });
      const d = await r.json();
      if (d.batch_id || d.job_ids) onJobSubmitted(null);
      else setError(d.error || d.detail || 'Showcase submit failed');
    } catch (e) {
      setError(String(e.message || e));
    } finally {
      setSubmitting(false);
    }
  };

  const submit = () => {
    if (showcaseMode) return submitShowcase();
    if (quickTestMode) return submitQuickTest();
    if (batchMode) return submitBatch();
    return submitSingle();
  };

  const canSubmit = !submitting && (
    batchMode
      ? (batchFiles.length + batchUrls.split('\n').filter(l => l.trim()).length) > 0
      : (mode === 'file' ? !!videoFile : !!ytUrl.trim())
  ) && model;

  // ── CTA label ──
  const submitLabel = (() => {
    if (submitting) return 'Submitting…';
    if (batchMode) {
      const c = batchFiles.length + batchUrls.split('\n').filter(l => l.trim()).length;
      if (c === 0) return 'Add at least one source';
      if (batchSchedule) return `Schedule ${c} videos for ${new Date(batchSchedule).toLocaleString()}`;
      return `Queue ${c} videos now`;
    }
    if (mode === 'file' && !videoFile) return 'Choose a video file';
    if (mode === 'url' && !ytUrl.trim()) return 'Paste a URL';
    if (!model) return loadingModels ? 'Loading models…' : 'Select a model';
    return 'Start dubbing';
  })();

  return (
    <div style={{ flex: 1, overflow: 'auto', position: 'relative', background: 'var(--bg)' }}>
      {/* Hero */}
      <Hero sphereOn={sphereOn}/>

      {/* Form */}
      <div style={{ maxWidth: 760, margin: '0 auto', padding: '0 32px 80px' }}>
        {error && (
          <div style={{
            margin: '0 0 24px',
            padding: '12px 14px',
            background: 'oklch(0.7 0.2 25 / 0.08)',
            border: '1px solid oklch(0.7 0.2 25 / 0.3)',
            borderRadius: 8, display: 'flex', alignItems: 'center', gap: 10,
          }}>
            <span style={{ color: 'var(--err)' }}>{I.cancel}</span>
            <div style={{ flex: 1, fontSize: 12.5, color: 'var(--ink)' }}>{error}</div>
            <button className="btn-ghost" style={{ padding: 4, color: 'var(--ink-3)' }} onClick={() => setError(null)}>{I.cancel}</button>
          </div>
        )}

        <SectionHeader index={1} title="Source media" subtitle="One file or batch · file upload or URL"/>

        <div style={{ display: 'flex', gap: 6, marginBottom: 16, flexWrap: 'wrap' }}>
          <ModeBtn active={!batchMode && !quickTestMode && !showcaseMode} onClick={() => switchTo('single')} label="Single video"/>
          <ModeBtn active={batchMode}     onClick={() => switchTo('batch')}    label="Batch — many videos"/>
          <ModeBtn active={quickTestMode} onClick={() => switchTo('quick')}    label="Quick test · multi-lang"/>
          <ModeBtn active={showcaseMode}  onClick={() => switchTo('showcase')} label="Showcase · stitched reel"/>
        </div>

        {showcaseMode && (
          <QuickTestForm
            kind="showcase"
            mode={mode} setMode={setMode}
            videoFile={videoFile} setVideoFile={setVideoFile}
            ytUrl={ytUrl} setYtUrl={setYtUrl}
            refFile={refFile}
            voicePreset={voicePreset}
            ttsSpeed={ttsSpeed}
            trimSeconds={qtTrimSeconds} setTrimSeconds={setQtTrimSeconds}
            langs={qtLangs} setLangs={setQtLangs}
            onSubmit={submitShowcase}
            submitting={submitting}
            error={error}/>
        )}

        {quickTestMode && (
          <QuickTestForm
            mode={mode} setMode={setMode}
            videoFile={videoFile} setVideoFile={setVideoFile}
            ytUrl={ytUrl} setYtUrl={setYtUrl}
            refFile={refFile}
            voicePreset={voicePreset}
            ttsSpeed={ttsSpeed}
            trimSeconds={qtTrimSeconds} setTrimSeconds={setQtTrimSeconds}
            langs={qtLangs} setLangs={setQtLangs}
            onSubmit={submitQuickTest}
            submitting={submitting}
            error={error}
          />
        )}

        {!quickTestMode && !showcaseMode && (<>
        {!batchMode && (
          <SingleSource
            mode={mode} setMode={setMode}
            videoFile={videoFile} setVideoFile={setVideoFile}
            ytUrl={ytUrl} setYtUrl={setYtUrl}
          />
        )}
        {batchMode && (
          <BatchSource
            files={batchFiles} setFiles={setBatchFiles}
            urls={batchUrls} setUrls={setBatchUrls}
          />
        )}

        <SectionHeader index={2} title="Languages & models"/>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14, marginBottom: 14 }}>
          <Field label="Source language">
            <Select value={srcLang} onChange={setSrcLang}>
              {LANGS.map(l => <option key={l.c} value={l.c} style={{ background: '#16161c' }}>{l.n}</option>)}
            </Select>
          </Field>
          <Field label="Target language">
            <Select value={tgtLang} onChange={setTgtLang}>
              {LANGS.filter(l => l.c !== 'auto').map(l => <option key={l.c} value={l.c} style={{ background: '#16161c' }}>{l.n}</option>)}
            </Select>
          </Field>
          <Field label="Translation model" hint={
            loadingModels ? 'Loading models from LM Studio…' :
            translationBackend === 'lm_studio' ? `LM Studio · ${availableModels.length} models available` :
            'Ollama'
          }>
            <Select value={model} onChange={setModel}>
              {loadingModels ? (
                <option value="" style={{ background: '#16161c' }}>Loading models…</option>
              ) : availableModels.length === 0 ? (
                <option value="" style={{ background: '#16161c' }}>
                  {translationBackend === 'lm_studio' ? 'No models found — check LM Studio' : 'No Ollama models found'}
                </option>
              ) : availableModels.map(m => (
                <option key={m} value={m} style={{ background: '#16161c' }}>{m}</option>
              ))}
            </Select>
          </Field>
          <Field label="Whisper model" hint="base = fastest, large-v3 = best quality">
            <Select value={whisperModel} onChange={setWhisperModel}>
              {WHISPER_MODELS.map(m => <option key={m.id} value={m.id} style={{ background: '#16161c' }}>{m.name} · {m.size} · {m.detail}</option>)}
            </Select>
          </Field>
        </div>

        <SectionHeader index={3} title="Voice"/>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8, marginBottom: 12 }}>
          {[
            ['main', 'Main speaker only', 'Best for solo videos · one consistent voice'],
            ['all',  'All speakers',       'Clone every detected voice'],
          ].map(([v, label, hint]) => (
            <button key={v} onClick={() => setSpeakerMode(v)} style={{
              padding: '10px 14px', borderRadius: 6, textAlign: 'left',
              cursor: 'pointer', transition: 'all 0.15s',
              background: speakerMode === v ? 'var(--bg-2)' : 'var(--bg-1)',
              border: '1px solid ' + (speakerMode === v ? 'var(--accent)' : 'var(--line)'),
              color: 'var(--ink)',
            }}>
              <div style={{ fontSize: 12.5, fontWeight: 500 }}>{label}</div>
              <div className="mono" style={{ fontSize: 10, color: 'var(--ink-3)', marginTop: 2 }}>{hint}</div>
            </button>
          ))}
        </div>
        <Field label="Voice preset" hint="Auto-clone uses each speaker's extracted reference. Pick a preset to override.">
          <Select value={voicePreset} onChange={setVoicePreset}>
            <option value="auto" style={{ background: '#16161c' }}>auto · clone source</option>
            {voicePresets.map(p => (
              <option key={p.id} value={p.id} style={{ background: '#16161c' }}>
                {p.name}{p.style ? ' · ' + p.style : ''}{p.type === 'file' ? ' · file' : ''}
              </option>
            ))}
          </Select>
        </Field>
        <div style={{ marginTop: 14 }}>
          <Field label="TTS speed">
            <div style={{ display: 'flex', gap: 6 }}>
              {['fast', 'balanced', 'quality'].map(s => (
                <button key={s} onClick={() => setTtsSpeed(s)} className="btn" style={{
                  flex: 1, justifyContent: 'center',
                  borderColor: ttsSpeed === s ? 'var(--accent)' : 'var(--line)',
                  background: ttsSpeed === s ? 'var(--bg-2)' : 'var(--bg-1)',
                  color: ttsSpeed === s ? 'var(--ink)' : 'var(--ink-2)',
                }}>{s}</button>
              ))}
            </div>
          </Field>
        </div>
        <div style={{ marginTop: 14 }}>
          <Field label="Voice reference (optional)" hint="WAV or MP3. 10-30s of clean speech.">
            <FileSlot file={refFile} setFile={setRefFile} accept="audio/*,video/*"/>
          </Field>
        </div>

        <SectionHeader index={4} title="Advanced"/>
        <Toggle value={keepBg}     onChange={setKeepBg}     label="Keep background audio (music / SFX)" hint="Uses audio-separator. Install required — see System."/>
        <Toggle value={autoDenoise} onChange={setAutoDenoise} label="Auto-denoise audio" hint="+3-5s · ON for noisy footage (mat sounds, crowd, AC hum) · OFF for clean studio audio"/>
        <Toggle value={lipSync} onChange={setLipSync}
                disabled={lipStatus && !lipStatus.installed}
                label={'Sync lips with Wav2Lip' + (lipStatus && !lipStatus.installed ? ' (not installed)' : '')}
                hint={lipStatus && !lipStatus.installed
                  ? 'Wav2Lip not detected. Install via System tab to enable. Adds 2-5x video duration to processing time.'
                  : 'Auto-runs Wav2Lip after dubbing. Best for talking-head footage; fails on action shots or far-away faces. Adds 2-5x video duration.'}/>
        <Toggle value={llmRegroup}  onChange={setLlmRegroup}  label="LLM segment regrouping" hint="+20-40s on long videos · fixes mid-sentence breaks · best for podcasts, lectures, seminars"/>
        <Toggle value={wizardReview} onChange={setWizardReview} label="Wizard mode — pause for review" hint="Pause after translation so you can edit segments and replace voice references."/>

        <div style={{ marginTop: 14 }}>
          <Field label="Translation context (optional)" hint="A short hint for the LLM. Examples: 'BJJ grappling seminar', 'tech podcast', 'cooking show'.">
            <input
              className="field"
              value={contextHint}
              onChange={e => setContextHint(e.target.value)}
              placeholder="e.g. BJJ seminar, tech podcast"
            />
          </Field>
        </div>

        {batchMode && (
          <>
            <SectionHeader index={5} title="Batch options"/>
            <Field label="Batch label (optional)">
              <input
                className="field"
                value={batchLabel}
                onChange={e => setBatchLabel(e.target.value)}
                placeholder="e.g. BJJ Course · Week 1"
              />
            </Field>
            <div style={{ marginTop: 14 }}>
              <Field label="Schedule start (optional)" hint="Empty = start now. Set to run overnight on cheap GPU hours.">
                <input
                  className="field"
                  type="datetime-local"
                  value={batchSchedule}
                  onChange={e => setBatchSchedule(e.target.value)}
                />
              </Field>
            </div>
          </>
        )}

        <div style={{ marginTop: 36, display: 'flex', gap: 10, alignItems: 'center' }}>
          <button onClick={submit} disabled={!canSubmit} className="btn btn-primary" style={{
            flex: 1, justifyContent: 'center', padding: '12px 16px', fontSize: 13,
          }}>
            {submitLabel} {canSubmit && I.arrow}
          </button>
          <span className="mono" style={{ fontSize: 10, color: 'var(--ink-4)' }}>⌘↵</span>
        </div>
        </>)}
      </div>
    </div>
  );
}

// ── Hero ──
function Hero({ sphereOn }) {
  const ref = useRef(null);
  useEffect(() => {
    if (!ref.current || !sphereOn) return;
    return mountSphere(ref.current, { variant: 'idle', size: 220 });
  }, [sphereOn]);

  return (
    <div style={{
      maxWidth: 760, margin: '0 auto',
      padding: '52px 32px 32px',
      display: 'flex', alignItems: 'flex-start', gap: 36,
    }}>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div className="caps" style={{ marginBottom: 12 }}>New dub</div>
        <h1 className="serif" style={{
          fontSize: 48, lineHeight: 1.02, letterSpacing: '-0.02em', marginBottom: 14,
        }}>
          Voice it back, <span style={{ fontStyle: 'italic', color: 'var(--ink-3)' }}>line by line</span>.
        </h1>
        <div style={{ fontSize: 13.5, color: 'var(--ink-2)', lineHeight: 1.55, maxWidth: 480 }}>
          Local, GPU-accelerated dubbing. WhisperX listens, Ollama translates, VoxCPM speaks.
          Drop a file or paste a URL below.
        </div>
      </div>
      {sphereOn && (
        <div ref={ref} style={{ width: 220, height: 220, flexShrink: 0, pointerEvents: 'none' }}/>
      )}
    </div>
  );
}

function ModeBtn({ active, onClick, label }) {
  return (
    <button onClick={onClick} style={{
      padding: '8px 14px', fontSize: 12.5, fontWeight: 500,
      borderRadius: 6,
      border: '1px solid ' + (active ? 'var(--accent)' : 'var(--line)'),
      background: active ? 'var(--bg-2)' : 'var(--bg-1)',
      color: active ? 'var(--ink)' : 'var(--ink-2)',
      cursor: 'pointer',
    }}>{label}</button>
  );
}

function SingleSource({ mode, setMode, videoFile, setVideoFile, ytUrl, setYtUrl }) {
  return (
    <div style={{ marginBottom: 12 }}>
      <div style={{ display: 'flex', gap: 4, marginBottom: 12 }}>
        <SubTab active={mode === 'file'} onClick={() => setMode('file')} label="File"/>
        <SubTab active={mode === 'url'}  onClick={() => setMode('url')}  label="URL"/>
      </div>
      {mode === 'file' && <FileSlot file={videoFile} setFile={setVideoFile} accept="video/*,audio/*"/>}
      {mode === 'url' && (
        <div style={{ display: 'flex', gap: 6 }}>
          <span style={{ display: 'flex', alignItems: 'center', padding: '0 12px', background: 'var(--bg-2)', border: '1px solid var(--line)', borderRight: 'none', borderRadius: '6px 0 0 6px', color: 'var(--ink-3)' }}>
            {I.link}
          </span>
          <input
            className="field"
            value={ytUrl}
            onChange={e => setYtUrl(e.target.value)}
            placeholder="https://youtube.com/watch?v=…"
            style={{ borderRadius: '0 6px 6px 0' }}
          />
        </div>
      )}
    </div>
  );
}

function SubTab({ active, onClick, label }) {
  return (
    <button onClick={onClick} style={{
      padding: '5px 12px', fontSize: 11, fontWeight: 500,
      borderRadius: 5,
      background: active ? 'var(--bg-2)' : 'transparent',
      color: active ? 'var(--ink)' : 'var(--ink-3)',
      cursor: 'pointer',
    }}>{label}</button>
  );
}

function FileSlot({ file, setFile, accept }) {
  const [drag, setDrag] = useState(false);
  const inputRef = useRef(null);

  const onPick = (f) => { if (f) setFile(f); };

  if (file) {
    return (
      <div style={{
        display: 'flex', alignItems: 'center', gap: 10,
        padding: '10px 12px',
        background: 'var(--bg-2)', border: '1px solid var(--accent-dim)',
        borderRadius: 6,
      }}>
        <div style={{
          width: 28, height: 28, borderRadius: 5,
          background: 'var(--bg-3)', border: '1px solid var(--line)',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          color: 'var(--accent)', flexShrink: 0,
        }}>{I.check}</div>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontSize: 12.5, color: 'var(--ink)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{file.name}</div>
          <div className="mono" style={{ fontSize: 10, color: 'var(--ink-4)', marginTop: 2 }}>
            {(file.size / (1024 * 1024)).toFixed(1)} MB
          </div>
        </div>
        <button className="btn-ghost" style={{ padding: 4, color: 'var(--ink-3)' }} onClick={() => setFile(null)}>{I.cancel}</button>
      </div>
    );
  }

  return (
    <div
      className={'dropzone' + (drag ? ' dragging' : '')}
      onClick={() => inputRef.current?.click()}
      onDragOver={e => { e.preventDefault(); setDrag(true); }}
      onDragLeave={() => setDrag(false)}
      onDrop={e => {
        e.preventDefault(); setDrag(false);
        if (e.dataTransfer.files[0]) onPick(e.dataTransfer.files[0]);
      }}
    >
      <input ref={inputRef} type="file" accept={accept} style={{ display: 'none' }}
        onChange={e => onPick(e.target.files[0])}/>
      <div style={{
        width: 36, height: 36, margin: '0 auto 8px', borderRadius: 8,
        background: 'var(--bg-2)', border: '1px solid var(--line)',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        color: 'var(--ink-2)',
      }}>{I.upload}</div>
      <div style={{ fontSize: 13, color: 'var(--ink)', marginBottom: 3 }}>Drop or click to choose</div>
      <div className="mono" style={{ fontSize: 10, color: 'var(--ink-4)' }}>video/audio · up to 4 GB</div>
    </div>
  );
}

// ── QuickTestForm (simplified for space) ──
function QuickTestForm({
  kind = 'quick',
  mode, setMode, videoFile, setVideoFile, ytUrl, setYtUrl,
  refFile, voicePreset, ttsSpeed,
  trimSeconds, setTrimSeconds, langs, setLangs,
  onSubmit, submitting, error,
}) {
  const isShowcase = kind === 'showcase';
  const TRIM_STOPS = [30, 60, 90, 120];
  const pickableLangs = LANGS.filter(l => l.c !== 'auto');

  const toggleLang = (code) => {
    if (langs.includes(code)) {
      if (langs.length > 2) setLangs(langs.filter(c => c !== code));
    } else {
      if (langs.length < 6) setLangs([...langs, code]);
    }
  };

  const sourceReady = (mode === 'file' && videoFile) || (mode === 'url' && ytUrl.trim());
  const langsOk = langs.length >= 2 && langs.length <= 6;

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 22 }}>
      <div>
        <div className="caps" style={{ marginBottom: 8 }}>
          {isShowcase ? 'Source · multilingual showcase reel' : 'Source · short clip'}
        </div>
        <div style={{ display: 'flex', gap: 6, marginBottom: 8 }}>
          <button className={'btn ' + (mode === 'file' ? 'btn-primary' : '')}
                  onClick={() => setMode('file')}>File</button>
          <button className={'btn ' + (mode === 'url' ? 'btn-primary' : '')}
                  onClick={() => setMode('url')}>URL</button>
        </div>
        {mode === 'file' ? (
          <input type="file" accept="video/*"
                 onChange={e => setVideoFile(e.target.files?.[0] || null)}
                 className="field"/>
        ) : (
          <input className="field" placeholder="https://youtube.com/watch?v=…"
                 value={ytUrl} onChange={e => setYtUrl(e.target.value)}/>
        )}
      </div>

      <div>
        <div className="caps" style={{ marginBottom: 8 }}>Trim duration</div>
        <div style={{ display: 'flex', gap: 6 }}>
          {TRIM_STOPS.map(s => (
            <button key={s}
              onClick={() => setTrimSeconds(s)}
              className={'btn ' + (trimSeconds === s ? 'btn-primary' : '')}
              style={{ flex: 1 }}>
              {s}s
            </button>
          ))}
        </div>
      </div>

      <div>
        <div style={{ display: 'flex', alignItems: 'baseline', gap: 10, marginBottom: 8 }}>
          <div className="caps">Target languages · {langs.length} of 2–6</div>
        </div>
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
          {pickableLangs.map(l => {
            const on = langs.includes(l.c);
            const disabled = !on && langs.length >= 6;
            return (
              <button key={l.c}
                onClick={() => toggleLang(l.c)}
                disabled={disabled}
                style={{
                  padding: '6px 10px', borderRadius: 4,
                  background: on ? 'var(--accent)' : 'var(--bg-1)',
                  color: on ? '#0a0a0d' : 'var(--ink-2)',
                  border: '1px solid ' + (on ? 'var(--accent)' : 'var(--line)'),
                  fontSize: 11.5, cursor: disabled ? 'not-allowed' : 'pointer',
                  opacity: disabled ? 0.4 : 1,
                }}>
                {l.n}
              </button>
            );
          })}
        </div>
      </div>

      <div style={{ padding: 12, background: 'var(--bg-1)', border: '1px solid var(--line)', borderRadius: 6 }}>
        <div className="mono" style={{ fontSize: 11, color: 'var(--ink-3)' }}>
          {isShowcase ? `${langs.length} languages · ${trimSeconds}s clip · stitched into one video` :
           `${langs.length} jobs × ${trimSeconds}s clip · sequential on the GPU queue`}
        </div>
      </div>

      {error && <div className="mono" style={{ fontSize: 11, color: 'var(--err)' }}>{error}</div>}

      <button className="btn btn-primary" disabled={submitting || !sourceReady || !langsOk} onClick={onSubmit}
              style={{ width: '100%', justifyContent: 'center', padding: '12px 16px' }}>
        {submitting ? 'Submitting…' : (isShowcase ? `Build showcase reel ▸ ${langs.length} langs` : `Start quick test ▸ ${langs.length} langs`)}
      </button>
    </div>
  );
}

// ── BatchSource (simplified) ──
function BatchSource({ files, setFiles, urls, setUrls }) {
  const inputRef = useRef(null);
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 14, marginBottom: 12 }}>
      <div>
        <div className="caps" style={{ marginBottom: 6 }}>Files · {files.length}</div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
          {files.map((f, i) => (
            <div key={i} style={{
              display: 'flex', alignItems: 'center', gap: 10,
              padding: '8px 12px',
              background: 'var(--bg-2)', border: '1px solid var(--line)',
              borderRadius: 6,
            }}>
              <span style={{ color: 'var(--accent)' }}>{I.check}</span>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 12.5, color: 'var(--ink)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{f.name}</div>
                <div className="mono" style={{ fontSize: 10, color: 'var(--ink-4)', marginTop: 2 }}>{(f.size / (1024 * 1024)).toFixed(1)} MB</div>
              </div>
              <button className="btn-ghost" style={{ padding: 4, color: 'var(--ink-3)' }} onClick={() => setFiles(files.filter((_, j) => j !== i))}>{I.cancel}</button>
            </div>
          ))}
          <input ref={inputRef} type="file" multiple accept="video/*,audio/*" style={{ display: 'none' }}
            onChange={e => { setFiles([...files, ...Array.from(e.target.files)]); e.target.value = ''; }}/>
          <button onClick={() => inputRef.current?.click()} style={{
            padding: '8px 10px', fontSize: 12, color: 'var(--ink-3)',
            background: 'transparent', border: '1px dashed var(--line-2)',
            borderRadius: 6, cursor: 'pointer',
            display: 'flex', alignItems: 'center', gap: 6, justifyContent: 'center',
          }}>{I.plus} Add files</button>
        </div>
      </div>

      <Field label="URLs · one per line" hint="YouTube, Vimeo, direct mp4 — anything yt-dlp handles.">
        <textarea
          className="field"
          value={urls}
          onChange={e => setUrls(e.target.value)}
          placeholder={`https://youtube.com/watch?v=…\nhttps://youtube.com/watch?v=…`}
          style={{ resize: 'vertical', minHeight: 80, fontFamily: 'var(--mono)', fontSize: 11.5 }}
        />
      </Field>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
// PROCESSING VIEW (placeholder)
// ═══════════════════════════════════════════════════════════════════
function ProcessingView({ runningJob, sphereOn, onJobCancelled, onSwitchToHome }) {
  if (!runningJob) {
    return (
      <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', flexDirection: 'column', gap: 16, padding: 40, background: 'var(--bg)' }}>
        <div className="caps">No active job</div>
        <div className="serif" style={{ fontSize: 32, letterSpacing: '-0.015em', textAlign: 'center', maxWidth: 480 }}>
          Nothing to watch <span style={{ fontStyle: 'italic', color: 'var(--ink-3)' }}>yet</span>.
        </div>
        <button onClick={onSwitchToHome} className="btn btn-primary">Start a new dub</button>
      </div>
    );
  }
  return (
    <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 40, background: 'var(--bg)' }}>
      <div className="serif" style={{ fontSize: 24 }}>Processing: {runningJob.source_label || runningJob.id}</div>
      <div style={{ marginLeft: 20 }}><StatusBadge status={runningJob.status}/></div>
      <div style={{ marginLeft: 20, width: 200 }}><LongProgress value={(runningJob.progress || 0) / 100}/></div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
// REVIEW VIEW (placeholder)
// ═══════════════════════════════════════════════════════════════════
function ReviewView({ jobs, selectedJobId, voicePresets, onContinued, onCancel, onPickJob }) {
  const reviewJobs = jobs.filter(j => j.status === 'awaiting_translation_review' || j.status === 'awaiting_transcript_review');
  const job = selectedJobId ? jobs.find(j => j.id === selectedJobId) : reviewJobs[0];
  
  if (!job) {
    return (
      <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', flexDirection: 'column', gap: 16, padding: 40, background: 'var(--bg)' }}>
        <div className="caps">No reviews pending</div>
        <div className="serif" style={{ fontSize: 32, letterSpacing: '-0.015em', textAlign: 'center', maxWidth: 480 }}>
          Wizard mode is <span style={{ fontStyle: 'italic', color: 'var(--ink-3)' }}>quiet</span>.
        </div>
      </div>
    );
  }
  return (
    <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 40, background: 'var(--bg)' }}>
      <div className="serif" style={{ fontSize: 24 }}>Review: {job.source_label || job.id}</div>
      <button className="btn btn-primary" style={{ marginLeft: 20 }} onClick={onContinued}>Continue</button>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
// RESULT VIEW (placeholder)
// ═══════════════════════════════════════════════════════════════════
function ResultView({ jobs, selectedJobId, voicePresets, onPickJob, onSwitchToHome, onSwitchToHistory }) {
  const completedJobs = jobs.filter(j => j.status === 'complete').sort((a, b) => (b.completed_at || b.created || 0) - (a.completed_at || a.created || 0));
  const job = selectedJobId ? jobs.find(j => j.id === selectedJobId) : completedJobs[0];
  
  if (!job) {
    return (
      <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', flexDirection: 'column', gap: 16, padding: 40, background: 'var(--bg)' }}>
        <div className="caps">No completed jobs yet</div>
        <div className="serif" style={{ fontSize: 32, letterSpacing: '-0.015em', textAlign: 'center', maxWidth: 480 }}>
          Nothing to <span style={{ fontStyle: 'italic', color: 'var(--ink-3)' }}>show off</span> yet.
        </div>
        <button onClick={onSwitchToHome} className="btn btn-primary">Start your first dub</button>
      </div>
    );
  }
  return (
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', padding: 40, background: 'var(--bg)' }}>
      <div className="serif" style={{ fontSize: 24, marginBottom: 20 }}>{job.source_label || job.id}</div>
      <video src={`/outputs/${job.id}/dubbed_video.mp4`} controls style={{ maxWidth: '80%', maxHeight: '60vh' }}/>
      <div style={{ marginTop: 20, display: 'flex', gap: 10 }}>
        <a className="btn btn-primary" href={`/outputs/${job.id}/dubbed_video.mp4`} download>Download MP4</a>
        <button className="btn" onClick={onSwitchToHistory}>Back to History</button>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
// HISTORY VIEW (placeholder)
// ═══════════════════════════════════════════════════════════════════
function HistoryView({ jobs, onJumpProcessing, onJumpReview, onJumpResult, onRefresh }) {
  return (
    <div style={{ flex: 1, overflow: 'auto', padding: 40, background: 'var(--bg)' }}>
      <div className="serif" style={{ fontSize: 32, marginBottom: 20 }}>History · {jobs.length} jobs</div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
        {jobs.slice(0, 20).map(j => (
          <div key={j.id} style={{ display: 'flex', alignItems: 'center', gap: 16, padding: 10, background: 'var(--bg-1)', border: '1px solid var(--line)', borderRadius: 6 }}>
            <StatusBadge status={j.status}/>
            <div style={{ flex: 1 }}>{j.source_label || j.source || j.id}</div>
            <div className="mono" style={{ fontSize: 11, color: 'var(--ink-3)' }}>{j.target_lang}</div>
            {j.status === 'complete' && <button className="btn" onClick={() => onJumpResult(j.id)}>View</button>}
          </div>
        ))}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
// BATCH VIEW (placeholder)
// ═══════════════════════════════════════════════════════════════════
function BatchView({ jobs, onRefresh, onJumpProcessing, onJumpResult, onJumpHome }) {
  return (
    <div style={{ flex: 1, overflow: 'auto', padding: 40, background: 'var(--bg)' }}>
      <div className="serif" style={{ fontSize: 32, marginBottom: 20 }}>Batch queue</div>
      <div style={{ color: 'var(--ink-3)' }}>Batch grouping coming soon — check back.</div>
      <button className="btn" style={{ marginTop: 20 }} onClick={onJumpHome}>Go to Home</button>

}

// ═══════════════════════════════════════════════════════════════════
// SYSTEM VIEW (placeholder)
// ═══════════════════════════════════════════════════════════════════
function SystemView({ system, onRefreshSystem }) {
  return (
    <div style={{ flex: 1, overflow: 'auto', padding: 40, background: 'var(--bg)' }}>
      <div className="serif" style={{ fontSize: 32, marginBottom: 20 }}>System</div>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 20 }}>
        <div style={{ padding: 16, background: 'var(--bg-1)', border: '1px solid var(--line)', borderRadius: 8 }}>
          <div className="caps">Translation Backend</div>
          <div style={{ fontSize: 18, marginTop: 8 }}>
            {system?.translation_backend === 'lm_studio' ? 'LM Studio' : 'Ollama'}
          </div>
          <div className="mono" style={{ fontSize: 11, color: 'var(--ink-3)', marginTop: 4 }}>
            {system?.lm_studio?.ok ? `Connected to ${system?.lm_studio?.url || 'localhost:1234'}` : 'Not connected'}
          </div>
          {system?.lm_studio?.models && (
            <div style={{ marginTop: 10 }}>
              <div className="caps" style={{ marginBottom: 4 }}>Available Models ({system.lm_studio.models.length})</div>
              <div style={{ fontSize: 11, color: 'var(--ink-2)', maxHeight: 200, overflow: 'auto' }}>
                {system.lm_studio.models.slice(0, 10).map(m => (
                  <div key={m} className="mono" style={{ padding: '2px 0' }}>· {m}</div>
                ))}
                {system.lm_studio.models.length > 10 && (
                  <div className="mono" style={{ color: 'var(--ink-4)' }}>+ {system.lm_studio.models.length - 10} more</div>
                )}
              </div>
            </div>
          )}
        </div>
        <div style={{ padding: 16, background: 'var(--bg-1)', border: '1px solid var(--line)', borderRadius: 8 }}>
          <div className="caps">GPU</div>
          <div style={{ fontSize: 18, marginTop: 8 }}>{system?.gpu?.name || 'No GPU detected'}</div>
          <div className="mono" style={{ fontSize: 11, color: 'var(--ink-3)', marginTop: 4 }}>
            {system?.gpu?.vram_gb ? `${system.gpu.vram_gb} GB VRAM` : 'CPU mode'}
          </div>
        </div>
        <button className="btn" style={{ marginTop: 10 }} onClick={onRefreshSystem}>Refresh</button>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
// ROOT APP
// ═══════════════════════════════════════════════════════════════════
function App() {
  const [view, setView] = useState('home');
  const [system, setSystem] = useState(null);
  const [voicePresets, setVoicePresets] = useState([]);
  const [jobs, setJobs] = useState([]);
  const [sphereOn, setSphereOn] = useState(true);
  const [selectedResultJobId, setSelectedResultJobId] = useState(null);
  const [selectedReviewJobId, setSelectedReviewJobId] = useState(null);

  // System polling
  useEffect(() => {
    const refresh = () => fetch('/api/system').then(r => r.json()).then(setSystem).catch(() => {});
    refresh();
    const t = setInterval(refresh, 5000);
    return () => clearInterval(t);
  }, []);

  // Voice presets
  useEffect(() => {
    fetch('/api/voices').then(r => r.json()).then(d => setVoicePresets(d.presets || [])).catch(() => {});
  }, [view]);

  // Jobs polling
  useEffect(() => {
    let stopped = false;
    const fetchJobs = async () => {
      try {
        const r = await fetch('/api/jobs');
        const d = await r.json();
        if (!stopped) setJobs(d.jobs || []);
      } catch (_) {}
    };
    fetchJobs();
    const interval = jobs.some(j => ACTIVE_STATUSES.has(j.status)) ? 2000 : 10000;
    const t = setInterval(fetchJobs, interval);
    return () => { stopped = true; clearInterval(t); };
  }, [jobs.some(j => ACTIVE_STATUSES.has(j.status))]);

  const runningJob = jobs.find(j => ACTIVE_STATUSES.has(j.status));
  const awaitingReviewCount = jobs.filter(j => j.status === 'awaiting_translation_review').length;

  const onJobSubmitted = (jobId) => {
    setView('processing');
    fetch('/api/jobs').then(r => r.json()).then(d => setJobs(d.jobs || [])).catch(() => {});
  };

  return (
    <div style={{ width: '100vw', height: '100vh', display: 'flex', background: 'var(--bg)' }}>
      <LeftRail
        view={view} setView={setView}
        runningJob={runningJob}
        awaitingReviewCount={awaitingReviewCount}
        system={system}
      />

      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', minWidth: 0 }}>
        <TopBar
          view={view}
          runningJob={runningJob}
          awaitingReviewCount={awaitingReviewCount}
          onJumpToProcessing={() => setView('processing')}
          onJumpToReview={() => setView('review')}
        />

        {view === 'home' && (
          <HomeView
            system={system}
            voicePresets={voicePresets}
            sphereOn={sphereOn}
            onJobSubmitted={onJobSubmitted}
          />
        )}

        {view === 'processing' && (
          <ProcessingView
            runningJob={runningJob}
            sphereOn={sphereOn}
            onJobCancelled={() => setView('history')}
            onSwitchToHome={() => setView('home')}
          />
        )}

        {view === 'review' && (
          <ReviewView
            jobs={jobs}
            selectedJobId={selectedReviewJobId}
            voicePresets={voicePresets}
            onContinued={() => { setSelectedReviewJobId(null); setView('processing'); }}
            onCancel={() => { setSelectedReviewJobId(null); setView('history'); }}
            onPickJob={setSelectedReviewJobId}
          />
        )}

        {view === 'result' && (
          <ResultView
            jobs={jobs}
            selectedJobId={selectedResultJobId}
            voicePresets={voicePresets}
            onPickJob={setSelectedResultJobId}
            onSwitchToHome={() => setView('home')}
            onSwitchToHistory={() => setView('history')}
          />
        )}

        {view === 'history' && (
          <HistoryView
            jobs={jobs}
            onJumpProcessing={() => setView('processing')}
            onJumpReview={(id) => { setSelectedReviewJobId(id); setView('review'); }}
            onJumpResult={(id) => { setSelectedResultJobId(id); setView('result'); }}
            onRefresh={() => fetch('/api/jobs').then(r => r.json()).then(d => setJobs(d.jobs || []))}
          />
        )}

        {view === 'batch' && (
          <BatchView
            jobs={jobs}
            onRefresh={() => fetch('/api/jobs').then(r => r.json()).then(d => setJobs(d.jobs || []))}
            onJumpProcessing={() => setView('processing')}
            onJumpResult={(id) => { setSelectedResultJobId(id); setView('result'); }}
            onJumpHome={() => setView('home')}
          />
        )}

        {view === 'voices' && <VoicesView/>}
        {view === 'glossary' && <GlossaryEditor/>}

        {view === 'system' && (
          <SystemView system={system} onRefreshSystem={() => fetch('/api/system').then(r => r.json()).then(setSystem)}/>
        )}
      </div>

      <div style={{
        position: 'fixed', bottom: 12, right: 16,
        padding: '6px 10px',
        background: 'var(--bg-2)', border: '1px solid var(--line)',
        borderRadius: 999,
        display: 'flex', alignItems: 'center', gap: 10,
        fontSize: 10, fontFamily: 'var(--mono)',
        color: 'var(--ink-4)', zIndex: 10,
      }}>
        <label style={{ display: 'flex', alignItems: 'center', gap: 6, cursor: 'pointer' }}>
          <input type="checkbox" checked={sphereOn} onChange={e => setSphereOn(e.target.checked)} style={{ accentColor: 'var(--accent)' }}/>
          sphere
        </label>
        <span style={{ color: 'var(--ink-4)' }}>·</span>
        <span>1-6 views · ⇧G sphere</span>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════════════
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
